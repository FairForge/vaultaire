# stored-s3-edge — the mover (WP-EDGE-1 Part A). Deployed on the PRODUCTION
# Cloudflare account to the stored.cloud zone's route s3.stored.cloud/*.
# The file IS the script (no_bundle): sha256(src/index.js) is the
# transparency log's client_build row for client `edge-ingest`
# (internal/translog/clientbuilds/manifest.json) and the deployed script
# downloads back byte-identical.
#
# Secrets: VAULTAIRE_EDGE_TOKEN (`wrangler secret put VAULTAIRE_EDGE_TOKEN <
# file` — never on a command line). Vars: VAULTAIRE_ORIGIN is where admit
# and commit go: the SLC host whose certificate is valid, NOT
# s3.stored.cloud (that would loop into this Worker).
#
# 0.3.0 (WP-EDGE-2 Part B): the codec's modules are published as their files
# too — src/codec.js, src/seal.js and src/wasm/{chunker.wasm, e2ee.wasm,
# wasm_exec.js} (`make edge-wasm`, the client_build recipe) — each a
# client_build row of its own. The codec spends CPU (≈ 11 s per GiB, the
# chunker): the 5-minute ceiling of Workers Paid.
name = "stored-s3-edge"
main = "src/index.js"
compatibility_date = "2026-09-01"
no_bundle = true
find_additional_modules = true
base_dir = "src"
rules = [
  { type = "ESModule", globs = ["*.js", "wasm/*.js"], fallthrough = false },
  { type = "CompiledWasm", globs = ["wasm/*.wasm"], fallthrough = false },
]
workers_dev = false
routes = [{ pattern = "s3.stored.cloud/*", zone_name = "stored.cloud" }]

[limits]
cpu_ms = 300000

[observability]
enabled = true

# WP-LOG-2 (D-LOG-1): no invocation event per request — it carried the URL
# (bucket and key in clear), the client's IP, postal code, coordinates and
# user agent, kept 7 days at Cloudflare. A data-plane host keeps no record of
# a request after it ends; the control plane's rows are the record.
[observability.logs]
invocation_logs = false

[vars]
VAULTAIRE_ORIGIN = "https://stored.ge"
# The codec refuses CODEC_TAMPER (a lab switch) on this environment.
ENVIRONMENT = "production"
# 0.8.0 (WP-LOG-2, D-LOG-1): the Worker writes no line; its failures are
# reported to the origin (POST /api/v1/edge/report). Verbose logging during an
# incident is a deploy-time var — `wrangler deploy --var EDGE_LOG:all` (or
# `errors`) — never committed; a deploy without it restores silence.
EDGE_LOG = "report"
