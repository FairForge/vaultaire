{{define "house-css"}}<style>
    /* The house on the dashboard (docs/DASHBOARD_PLAN.md Phase 2). Emitted by
       build.py into internal/dashboard/templates/generated/house.html as the
       "house-css" template; NIGHT lines are expanded the same way as landing.css.

    .sprite-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

    .house-room.wall-midnight { --wall-a: #0a3a63; --wall-b: #125594; --wall-deep: #0b2f52; }
    .house-room.wall-matcha { --wall-a: #9fbc98; --wall-b: #b8cfb0; --wall-deep: #6f8f6a; }
    .house-room.wall-oat { --wall-a: #e2d3ba; --wall-b: #eee3d0; --wall-deep: #c4a983; }
    .house-room.wall-blush { --wall-a: #eeb6bb; --wall-b: #f6cfd0; --wall-deep: #d98c98; }
    .house-room.wall-butter { --wall-a: #f1d98a; --wall-b: #f8e9b3; --wall-deep: #d4ae46; }
    .house-room.wall-lilac { --wall-a: #c2b3e6; --wall-b: #d7cdf1; --wall-deep: #9d8ccf; }
    .house-room.fit-midnight { --fit: #1c3445; }
    .house-room.fit-matcha { --fit: #5f7f5a; }
    .house-room.fit-oat { --fit: #b59f7c; }
    .house-room.fit-blush { --fit: #d9828f; }
    .house-room.fit-lilac { --fit: #8f7cc8; }
    .house-room.fit-noir { --fit: #2b2b2b; }
    .house-svg { display: block; width: 100%; height: auto; color: var(--fit); shape-rendering: crispEdges; }
    .house-svg .hit { fill: transparent; }
    .house-svg a.hs-piece { outline: none; cursor: pointer; }
    .house-svg a.hs-piece:hover .hit, .house-svg a.hs-piece:focus-visible .hit { stroke: #ffd400; stroke-width: 1; stroke-dasharray: 2 1; }
    .house-svg .hs-empty { opacity: 0.3; }
    .house-svg .tb-tag, .house-svg .zone-labels { pointer-events: none; }
    .wave-b { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
        .wave-a { animation: wave-a 4.5s infinite; }
        .wave-b { animation: wave-b 4.5s infinite; }
        .light-pool { animation: breathe 3.8s ease-in-out infinite; }
    }
    @keyframes wave-a { 0%, 9.9% { opacity: 1; } 10%, 19.9% { opacity: 0; } 20%, 29.9% { opacity: 1; } 30%, 39.9% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes wave-b { 0%, 9.9% { opacity: 0; } 10%, 19.9% { opacity: 1; } 20%, 29.9% { opacity: 0; } 30%, 39.9% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes breathe { 50% { opacity: 0.86; } }
