    .house-svg .hs-empty { opacity: 0.3; }
    .house-svg .tb-tag, .house-svg .zone-labels { pointer-events: none; }
    .wave-b { opacity: 0; }

        .wave-a { animation: wave-a 4.5s infinite; }

    }
    @keyframes wave-a { 0%, 9.9% { opacity: 1; } 10%, 19.9% { opacity: 0; } 20%, 29.9% { opacity: 1; } 30%, 39.9% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes wave-b { 0%, 9.9% { opacity: 0; } 10%, 19.9% { opacity: 1; } 20%, 29.9% { opacity: 0; } 30%, 39.9% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes breathe { 50% { opacity: 0.86; } }
    /* night follows the shared theme (data-theme on <html>, else the system) */
    .night-dim { opacity: 0; transition: opacity 0.4s ease; }
    .glow { opacity: 0; transition: opacity 0.4s ease; pointer-events: none; mix-blend-mode: screen; }

    :root[data-theme="dark"] .moon-light { opacity: 1; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vignette { opacity: 1; } }
    :root[data-theme="dark"] .vignette { opacity: 1; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sh-day { opacity: 0; } }
    :root[data-theme="dark"] .sh-day { opacity: 0; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sh-night { opacity: 1; } }
    :root[data-theme="dark"] .sh-night { opacity: 1; }

    :root[data-theme="dark"] .zone-floor { fill: #e8dcc8; }
</style>{{end}}
