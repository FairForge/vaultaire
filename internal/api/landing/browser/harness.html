<!DOCTYPE html>
<!--
  Browser checks for the landing page builder. Loads the rendered page
  variants (written next to this file by `go test -run TestLanding_WriteVariants`
  with LANDING_OUT set) and drives the house builder with synthetic pointer,
  keyboard and click events. Prints one line per check into #out; run.sh
  fails when any line starts with FAIL.
-->
<html><body>
<pre id="out">running</pre>
<iframe id="f" src="closed.html" style="width:1280px;height:2400px"></iframe>
<iframe id="g" src="closed.html#room=v1.oat.noir.Mia.safe-10-24_lockbox-40-51_box-60-51_fireplace-5-5_mascot-80-38" style="width:1280px;height:2400px"></iframe>
<iframe id="h" src="open.html#room=v2.matcha.blush.Zo%C3%AB%3Cb%3E.box-20-88-p_dresser-40-31-v_box-60-88_evil-1-1_mascot-80-77_mascot-90-77" style="width:1280px;height:2400px"></iframe>
<script>
var out = [], errs = [];
function ok(cond, name, detail) { out.push((cond ? 'PASS ' : 'FAIL ') + name + (detail ? ': ' + detail : '')); }
['f', 'g', 'h'].forEach(function (id) {
    var fr = document.getElementById(id);
    fr.addEventListener('load', function () { fr.contentWindow.addEventListener('error', function (e) { errs.push(id + ': ' + e.message); }); });
});
function money(n) { return '$' + n.toFixed(2); }

window.onload = function () { setTimeout(run, 900); };

function run() {
    var fr = document.getElementById('f'), d = fr.contentDocument, w = fr.contentWindow;
    try {
        var ns = d.createElement('style'); ns.textContent = '*{transition:none!important;animation:none!important}'; d.head.appendChild(ns);
        try { w.localStorage.clear(); } catch (e) { /* fine */ }
        function lines() { return d.getElementById('r-lines').textContent.replace(/\s+/g, ' '); }
        function total() { return d.getElementById('r-total').textContent; }
        function pieces() { return d.querySelectorAll('#room-items .piece').length; }
        function tags() { return Array.from(d.querySelectorAll('#room-tags text')).map(function (t) { return t.textContent; }); }
        function pe(t, x, y, el) { el.dispatchEvent(new w.PointerEvent(t, { bubbles: true, clientX: x, clientY: y, pointerId: 1, button: 0, pointerType: 'mouse' })); }

        // ---- starter house: 6 TB downstairs + 1 TB attic at the published rates
        var P = w.__LANDING_PRICES__ || { ground: 4.49, attic: 2.0 };
        ok(pieces() === 6, 'starter has 6 pieces', pieces());
        ok(total() === money(6 * P.ground + 1 * P.attic), 'starter total', total());
        ok(/Downstairs 6 TB/.test(lines()) && /Attic 1 TB/.test(lines()), 'receipt has a line per floor', lines());

        // ---- add from the tray, drag it up, price follows the floor
        d.querySelector('.piece-card[data-add="bookcase"]').click();
        ok(total() === money(16 * P.ground + 1 * P.attic), 'bookcase lands downstairs', total());
        var room = d.getElementById('room'), r = room.getBoundingClientRect(), u = r.height / 115;
        var bc = d.querySelector('#room-items .piece[aria-label^="Bookcase"]'), b = bc.getBoundingClientRect();
        var cx = b.left + b.width / 2, cy = b.top + b.height / 2;
        pe('pointerdown', cx, cy, bc); pe('pointermove', cx, cy - 40 * u, bc);
        var midTag = w.getComputedStyle(d.querySelector('#room-tags .tb-tag:last-child rect')).fill;
        pe('pointerup', cx, cy - 40 * u, bc);
        ok(midTag === 'rgb(185, 199, 210)', 'tag turns grey mid-drag', midTag);
        ok(total() === money(6 * P.ground + 11 * P.attic), 'bookcase priced as attic after drag', total());
        ok(/Attic 11 TB/.test(lines()) && /saves/.test(lines()), 'attic line shows saving', lines());

        // ---- toolbar: move / open / remove + undo
        var dr = d.querySelector('#room-items .piece[aria-label^="Dresser"]'); dr.dispatchEvent(new w.FocusEvent('focus'));
        var mv = d.getElementById('b-move');
        ok(!d.getElementById('b-piece-tools').hidden && mv.textContent === 'to attic', 'toolbar shows "to attic" for a downstairs piece', mv.textContent);
        mv.click();
        ok(total() === money(1 * P.ground + 16 * P.attic), 'move button re-prices the dresser', total());
        ok(d.getElementById('b-move').textContent === 'bring down', 'move button flips to "bring down"');
        d.getElementById('b-open').click();
        ok(/back in minutes/.test(Array.from(d.querySelectorAll('.float-note')).map(function (n) { return n.textContent; }).join(' ')), 'open note for an attic piece');
        var lp = d.querySelector('#room-items .piece[aria-label^="Lamp"]'); lp.dispatchEvent(new w.FocusEvent('focus'));
        ok(d.getElementById('b-move').hidden && !d.getElementById('b-remove').hidden, 'decor gets remove but not move');
        var before = pieces();
        d.getElementById('b-remove').click();
        var toast = d.querySelector('.toast.act');
        ok(pieces() === before - 1 && !!toast, 'remove drops the piece and offers undo');
        toast.querySelector('button').click();
        ok(pieces() === before, 'undo restores the piece', pieces());

        // ---- keyboard: ArrowUp hops a storage piece to the attic, Delete removes
        var bx = d.querySelector('#room-items .piece[aria-label^="Storage box: 1 TB, downstairs"]');
        bx.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }));
        ok(!/Downstairs/.test(lines()), 'ArrowUp moves the last downstairs box to the attic', lines());

        // ---- why strip: pack, unpack, send to the attic with labels
        d.querySelector('.chip[data-pack="p"]').click(); d.querySelector('.chip[data-pack="v"]').click();
        ok(d.querySelectorAll('#packed .packed-item').length === 2 && !d.getElementById('pack-up').disabled, 'two chips packed');
        ok(/6 TB packed/.test(d.getElementById('packed-line').textContent), 'packed line totals the TB', d.getElementById('packed-line').textContent);
        d.querySelector('.chip[data-pack="v"]').click();
        ok(d.querySelectorAll('#packed .packed-item').length === 1, 'unpack by chip');
        d.querySelector('.chip[data-pack="v"]').click();
        var n0 = pieces();
        d.getElementById('pack-up').click();
        ok(pieces() === n0 + 2 && d.querySelectorAll('#packed .packed-item').length === 0, 'send to attic adds the packed pieces');
        ok(/1 dresser of videos/.test(lines()) && /storage box of photos/.test(lines()), 'receipt names the labelled pieces', lines());
        ok(tags().indexOf('PHOTOS 1 TB') >= 0 && tags().indexOf('VIDEOS 5 TB') >= 0, 'tags carry labels', tags().join(','));
        ok(/-p(_|$)/.test(w.localStorage.getItem('sg-room')) && /-v(_|$)/.test(w.localStorage.getItem('sg-room')), 'labels persist in saved state');

        // ---- vibe + name
        d.querySelector('[data-wall="blush"]').click();
        ok(d.documentElement.style.getPropertyValue('--wall-a') === '#eeb6bb', 'wall swatch sets the vibe');
        var inp = d.getElementById('vault-name'); inp.value = 'Zoë <script>'; inp.dispatchEvent(new w.Event('input'));
        ok(d.getElementById('room-sign').textContent === 'zoë script’s place', 'name is filtered and lettered on the sign', d.getElementById('room-sign').textContent);

        // ---- old (v1) links map onto the house; v2 links with junk are cleaned
        var e = document.getElementById('g').contentDocument;
        ok(e.querySelectorAll('#room-items .piece').length === 5, 'v1 link: 5 pieces', e.querySelectorAll('#room-items .piece').length);
        ok(/Attic 11 TB/.test(e.getElementById('r-lines').textContent.replace(/\s+/g, ' ')), 'v1 link: archive pieces went to the attic');
        var hh = document.getElementById('h').contentDocument;
        ok(hh.querySelectorAll('#room-items .piece').length === 4, 'v2 link: junk piece and second mascot dropped', hh.querySelectorAll('#room-items .piece').length);
        ok(hh.getElementById('room-sign').textContent === 'zoëb’s place', 'v2 link: name filtered', hh.getElementById('room-sign').textContent);
        ok(hh.querySelector('a[href="/register"]') !== null, 'open variant links /register');

        // ---- export renders a PNG of the right size
        var got = null; w.HTMLAnchorElement.prototype.click = function () { got = this.download; };
        var dims = null, ob = w.HTMLCanvasElement.prototype.toBlob;
        w.HTMLCanvasElement.prototype.toBlob = function (cb) { dims = this.width + 'x' + this.height; ob.call(this, cb); };
        d.getElementById('b-save').click();
        setTimeout(function () {
            ok(dims === '1024x1044' && got === 'my-stored-house.png', 'save image exports 1024x1044 png', dims + ' ' + got);
            ok(errs.length === 0, 'no script errors', errs.join('; '));
            document.getElementById('out').textContent = out.join('\n') + '\nDONE';
        }, 1500);
    } catch (x) {
        out.push('FAIL exception: ' + (x.stack || x));
        document.getElementById('out').textContent = out.join('\n') + '\nDONE';
    }
}
</script>
</body></html>
