<!DOCTYPE html>
<!--
  Browser checks for the landing page. Loads the rendered page variants
  (written next to this file by `go test -run TestLanding_WriteVariants` with
  LANDING_OUT set) and drives the box picker and the scenes with synthetic
  pointer, keyboard and click events. Prints one line per check into #out;
  run.sh fails when any line starts with FAIL.
-->
<html><body>
<pre id="out">running</pre>
<iframe id="f" src="closed.html" style="width:1280px;height:2400px"></iframe>
<iframe id="h" src="open.html" style="width:1280px;height:2400px"></iframe>
<script>
var out = [], errs = [];
function ok(cond, name, detail) { out.push((cond ? 'PASS ' : 'FAIL ') + name + (detail ? ': ' + detail : '')); }
['f', 'h'].forEach(function (id) {
    var fr = document.getElementById(id);
    fr.addEventListener('load', function () { fr.contentWindow.addEventListener('error', function (e) { errs.push(id + ': ' + e.message); }); });
});
function money(n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

window.onload = function () { setTimeout(run, 900); };

function run() {
    var fr = document.getElementById('f'), d = fr.contentDocument, w = fr.contentWindow;
    try {
        var ns = d.createElement('style'); ns.textContent = '*{transition:none!important;animation:none!important}'; d.head.appendChild(ns);
        var P = { std: 4.49, std_monthly: 4.99, vault: 2.0, vault_monthly: 2.55, vault_min: 4.99, aws: 23.0 };
        function lines() { return d.getElementById('r-lines').textContent.replace(/\s+/g, ' '); }
        function total() { return d.getElementById('r-total').textContent; }
        function boxes(kind) { return d.querySelectorAll('#pick-boxes .pick-box[data-kind="' + kind + '"]').length; }
        function tags() { return Array.from(d.querySelectorAll('#pick-tags text')).map(function (t) { return t.textContent; }); }
        function step(kind, by) { d.querySelector('[data-step="' + kind + '"][data-by="' + by + '"]').click(); }

        // ---- starter: 2 TB Standard (boxes) + 5 TB Vault (crates)
        ok(boxes('std') === 2 && boxes('vault') === 5, 'starter: 2 boxes and 5 crates', boxes('std') + '/' + boxes('vault'));
        ok(total() === money(2 * P.std + 5 * P.vault), 'starter total', total());
        ok(/Standard\s*2 TB/.test(lines()) && /Vault\s*5 TB/.test(lines()), 'receipt has a line per kind', lines());
        ok(tags().indexOf('STANDARD 2 TB') >= 0 && tags().indexOf('VAULT 5 TB') >= 0, 'piles are labelled', tags().join(','));
        ok(/7 TB on AWS S3: \$161\.00/.test(d.getElementById('r-save').textContent), 'AWS comparison', d.getElementById('r-save').textContent);
        ok(/1\.8 million photos/.test(d.getElementById('b-meter').textContent), 'photo meter', d.getElementById('b-meter').textContent);
        var h0 = w.sgHouse();
        ok(h0.std === 0 && h0.vault === 0, 'an untouched starter is not reported', JSON.stringify(h0));
        ok(!/attic|downstairs|dresser|bookcase/i.test(d.getElementById('build').textContent), 'no house words in the picker');

        // ---- steppers: one box per click, priced by kind
        step('std', 1);
        ok(boxes('std') === 3 && total() === money(3 * P.std + 5 * P.vault), 'plus adds a Standard box', boxes('std') + ' ' + total());
        step('vault', -1); step('vault', -1);
        ok(boxes('vault') === 3 && total() === money(3 * P.std + 3 * P.vault), 'minus takes crates away', boxes('vault') + ' ' + total());
        var h1 = w.sgHouse();
        ok(h1.std === 3 && h1.vault === 3, 'sgHouse reports the TB once edited', JSON.stringify(h1));
        // the second row of a pile stands on the first
        var ys = Array.from(d.querySelectorAll('#pick-boxes .pick-box[data-kind="std"]')).map(function (g) { return g.getAttribute('transform'); });
        ok(ys.join(',') === 'translate(3 45),translate(20 45),translate(37 45)', 'three boxes on the floor', ys.join(','));
        step('std', 1);
        ok(d.querySelector('#pick-boxes .pick-box[data-kind="std"][transform="translate(3 32)"]') !== null, 'the fourth box stacks on the first');

        // ---- typing a number; a big one is capped on screen, never in the price
        var inp = d.getElementById('pick-vault');
        inp.value = '40'; inp.dispatchEvent(new w.Event('input'));
        ok(boxes('vault') === 12 && tags().indexOf('VAULT 40 TB (12 SHOWN)') >= 0, 'a big pile shows 12 crates and says so', boxes('vault') + ' ' + tags().join(','));
        ok(total() === money(4 * P.std + 40 * P.vault), 'typed TB priced', total());
        inp.value = '-3'; inp.dispatchEvent(new w.Event('change'));
        ok(inp.value === '0' && boxes('vault') === 0 && !/Vault/.test(lines()), 'a negative number is zero and the Vault line goes', inp.value + ' ' + lines());
        ok(d.querySelector('[data-step="vault"][data-by="-1"]').disabled, 'minus is disabled at zero');

        // ---- monthly: monthly rates, the Vault minimum
        step('vault', 1);
        var mo = d.querySelector('input[name="pick-period"][value="monthly"]'); mo.checked = true; mo.dispatchEvent(new w.Event('change'));
        ok(total() === money(4 * P.std_monthly + P.vault_min), 'monthly applies the Vault minimum', total());
        ok(/monthly minimum/.test(lines()) && /billed monthly/.test(d.getElementById('r-period').textContent), 'the minimum is named', lines());
        var yr = d.querySelector('input[name="pick-period"][value="annual"]'); yr.checked = true; yr.dispatchEvent(new w.Event('change'));
        ok(total() === money(4 * P.std + 1 * P.vault), 'back to yearly', total());

        // ---- empty
        d.getElementById('pick-std').value = '0'; d.getElementById('pick-std').dispatchEvent(new w.Event('change'));
        step('vault', -1);
        ok(total() === '$0.00' && /add a box/.test(lines()) && d.getElementById('r-save').textContent === '', 'nothing picked', lines());

        // ---- the open variant: the plan rides into /register once edited
        var hd = document.getElementById('h').contentDocument;
        var cta = hd.querySelector('.r-actions a.btn-primary');
        ok(cta.getAttribute('href') === '/register', 'untouched open variant links plain /register', cta.getAttribute('href'));
        hd.querySelector('[data-step="std"][data-by="1"]').click();
        ok(cta.getAttribute('href') === '/register?std_tb=3&vault_tb=5', 'receipt button carries the TB into /register', cta.getAttribute('href'));
        ok(hd.querySelector('a[href="/register"]') !== null, 'open variant links /register');

        // ---- the picker's room is a scene too: a box can be picked up and put down
        ok(d.querySelector('#pick-scene .scene-shadows') !== null, 'the picker room casts shadows');

        // ---- hero scene: pieces drag on touch, fall to the floor or onto what is under them
        var hero = d.querySelector('svg.scene[data-play]:not(#pick-scene)'), hr = hero.getBoundingClientRect(), hu = hr.width / 160;
        function at(g) { var b = g.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; }
        function drag(g, dx, dy, type) {
            var c = at(g);
            g.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, clientX: c[0], clientY: c[1], pointerId: 2, button: 0, pointerType: type || 'mouse' }));
            g.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true, clientX: c[0] + dx * hu, clientY: c[1] + dy * hu, pointerId: 2, button: 0, pointerType: type || 'mouse' }));
            g.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true, clientX: c[0] + dx * hu, clientY: c[1] + dy * hu, pointerId: 2, button: 0, pointerType: type || 'mouse' }));
        }
        function posOf(g) { var m = /translate\((-?\d+) (-?\d+)\)/.exec(g.getAttribute('transform')); return [Number(m[1]), Number(m[2])]; }
        var hbox = hero.querySelector('.piece[transform="translate(60 33)"]'), htop = hero.querySelector('.piece[transform="translate(25 20)"]'), hbase = hero.querySelector('.piece[transform="translate(17 33)"]');
        ok(w.getComputedStyle(hbox).touchAction === 'none', 'hero pieces take the touch', w.getComputedStyle(hbox).touchAction);
        drag(hbox, 0, -20, 'touch');
        ok(posOf(hbox)[1] === 33, 'a box dropped in mid-air falls to the floor', posOf(hbox).join(','));
        drag(hbox, -26, -22);
        ok(posOf(hbox)[1] === 20, 'a box dropped over a crate rests on it', posOf(hbox).join(','));
        drag(hbase, -16, 0);
        ok(posOf(htop)[1] === 33, 'what stood on a crate falls when it leaves', posOf(htop).join(','));
        hbox.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, clientX: at(hbox)[0], clientY: at(hbox)[1], pointerId: 3, button: 0, pointerType: 'mouse' }));
        hbox.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true, clientX: at(hbox)[0], clientY: at(hbox)[1], pointerId: 3, button: 0, pointerType: 'mouse' }));
        ok(hbox.classList.contains('pop'), 'a tap bounces the piece where it is');

        // ---- the waitlist sends the picked TB along
        var sent = null;
        w.fetch = function (url, opts) { if (url === '/api/waitlist') sent = JSON.parse(opts.body); return Promise.resolve({}); };
        step('std', 1); step('vault', 1); step('vault', 1);
        var form = d.querySelector('[data-waitlist]');
        form.querySelector('input[name=email]').value = 'a@example.com';
        form.dispatchEvent(new w.Event('submit', { cancelable: true }));
        setTimeout(function () {
            ok(sent && sent.std_tb === 1 && sent.vault_tb === 2 && sent.email === 'a@example.com', 'waitlist carries std_tb / vault_tb', JSON.stringify(sent));
            ok(errs.length === 0, 'no script errors', errs.join('; '));
            document.getElementById('out').textContent = out.join('\n') + '\nDONE';
        }, 600);
    } catch (x) {
        out.push('FAIL exception: ' + (x.stack || x));
        document.getElementById('out').textContent = out.join('\n') + '\nDONE';
    }
}
</script>
</body></html>
