# /etc/sysctl.d/91-vaultaire-tcp.conf — docs/DEPLOY.md "Host tuning" (2026-10-21).
# The buffers, BBR + fq, backlogs and port range are in 99-vaultaire.conf
# (2026-04-20). These two on top:
# probe the path MTU when a long path black-holes ICMP (a stalled transfer
# instead of a slow one otherwise)
net.ipv4.tcp_mtu_probing = 1
# keep at most 128 KiB unsent in a socket's queue — without it a writer can
# park the whole 64 MiB send buffer per connection (memory and latency)
net.ipv4.tcp_notsent_lowat = 131072
