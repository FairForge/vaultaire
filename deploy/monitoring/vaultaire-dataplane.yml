# Data-plane hosts — install to /etc/prometheus/rules/ (see README).
#
# Series come from the app's /metrics (WP-EDGE-3, internal/api/data_plane_health.go;
# read from the data_plane_hosts registry on scrape, 15 s cache):
#   vaultaire_data_plane_host_up{host,kind}   1 = the host's registry health is up and, for a
#                                             node, its last heartbeat (every 30 s) is within 90 s;
#                                             kind = edge (the Worker) | node | slc (the origin)
#   vaultaire_data_plane_admits_total{host,op,outcome}, vaultaire_data_plane_bytes_total{host,op}
#                                             what each host was admitted and moved
#
# WP-LOG-2 (a data-plane host keeps no log; the control plane's rows are the record):
#   vaultaire_data_plane_commits_total{host,op,outcome}   accepted commit calls by the host's
#                                             outcome (ok|backend_error|edge_error|checksum_mismatch,
#                                             served|fallback|error, other, replay)
#   vaultaire_data_plane_pass_through_total{host,op,reason}  admits the origin took, by reason
#   vaultaire_data_plane_host_reports_total{host,kind}   failures a host reported to
#                                             POST /api/v1/edge/report (one Warn line each:
#                                             journalctl -u 'vaultaire@*' | grep 'edge host report')
#   vaultaire_edge_admit_reaper_total{outcome}  expired = an admit no commit ever settled
#   vaultaire_edge_worker_requests{script,status}, vaultaire_edge_worker_cpu_p99_seconds{script,status}
#                                             Cloudflare's own Worker metrics of the last 15 min
#                                             (the edge_worker_metrics job, every 5 min)
#   vaultaire_synthetic_check_edge_enabled    1 while the canary's edge leg is configured
#
# Not seen by design: a request Cloudflare refuses before the Worker runs (its 413), and a
# host failure while the origin is unreachable (the report cannot arrive) — the canary's
# edge leg and EdgeWorkerErrors are the signal there.
#
# A node unseen for 90 s is refused new admits at once (503 host_down, Retry-After 30 —
# its clients' requests go to the origin through their retry or their endpoint's
# fallback) and the edge_admit_reaper marks it down (5 min). Its commits are always
# accepted. A node set `draining` on /api/v1/admin/data-plane-hosts/{host} reads 0 too.
#
# Triage when DataPlaneHostDown fires: GET /api/v1/admin/data-plane-hosts/<host>
# (last_seen, version); on the node, `systemctl status vaultaire-node` and
# `journalctl -u vaultaire-node` (its heartbeat line names the control plane's answer).
# A node gone for good: DELETE its row (its token dies within 15 s).
groups:
  - name: vaultaire-dataplane
    rules:
      - alert: DataPlaneHostDown
        expr: vaultaire_data_plane_host_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Data-plane host {{ $labels.host }} ({{ $labels.kind }}) is down"
          description: "The host's registry health is not up, or a node sent no heartbeat for 90 s. Its admits are refused (503 host_down); the origin serves its clients. GET /api/v1/admin/data-plane-hosts/{{ $labels.host }}; on a node: systemctl status vaultaire-node."

      - alert: DataPlaneAdmitsExpiring
        expr: |
          sum(increase(vaultaire_edge_admit_reaper_total{outcome="expired"}[1h])) >= 5
          and
          sum(increase(vaultaire_edge_admit_reaper_total{outcome="expired"}[1h]))
            / clamp_min(sum(increase(vaultaire_data_plane_admits_total{outcome=~"admitted.*"}[1h])), 1) > 0.02
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Edge admits are expiring without a commit"
          description: "More than 2 % of the last hour's admitted edge transfers (and at least 5) were never committed: the reaper expired them. Each is an EdgeNoCommit row in the customer's request log; a GET was metered for its admitted size. A host is failing after the admit (reports: grep 'edge host report'), or its commit cannot reach the origin. GET /api/v1/admin/jobs (edge_admit_reaper); journalctl -u 'vaultaire@*' | grep 'edge get admit expired'."

      - alert: DataPlaneCommitsFailing
        expr: |
          (
            sum by (host) (increase(vaultaire_data_plane_commits_total{outcome=~"backend_error|edge_error|checksum_mismatch|error"}[30m]))
            / clamp_min(sum by (host) (increase(vaultaire_data_plane_commits_total[30m])), 1)
          ) > 0.05
          and
          sum by (host) (increase(vaultaire_data_plane_commits_total{outcome=~"backend_error|edge_error|checksum_mismatch|error"}[30m])) >= 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A data-plane host's commits are failing"
          description: "More than 5 % of the host's commits of the last 30 minutes (and at least 5) report a failure (backend_error, edge_error, checksum_mismatch, error). Each failed write was answered to its client as the origin would; a read fell back to the origin. journalctl -u 'vaultaire@*' | grep '\"edge commit\"' (the state and backend_status of each); the backend's breaker and probe."

      - alert: DataPlaneHostReporting
        expr: sum by (host, kind) (increase(vaultaire_data_plane_host_reports_total{kind!="exception"}[15m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A data-plane host is reporting failures"
          description: "The host sent more than 10 failure reports of one kind in 15 minutes (POST /api/v1/edge/report). journalctl -u 'vaultaire@*' | grep 'edge host report' names each one's kind, request id, admit id, op, status and detail. The host keeps no log of its own."

      - alert: DataPlaneHostException
        expr: sum by (host) (increase(vaultaire_data_plane_host_reports_total{kind="exception"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A data-plane host threw"
          description: "The host's top-level handler caught an exception and answered the client a pass-through or a 503. journalctl -u 'vaultaire@*' | grep 'edge host report' | grep exception (the message and the first stack line)."

      - alert: EdgeWorkerErrors
        expr: vaultaire_edge_worker_requests{status!~"success|clientDisconnected"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A Worker's invocations are failing at Cloudflare"
          description: "Cloudflare's own metrics (the edge_worker_metrics job) count invocations of the last 15 minutes that ended neither in success nor in a client disconnect (scriptThrewException, exceededCpu, exceededMemory, …): the client got Cloudflare's error page. The Worker logs nothing by default: re-deploy with --var EDGE_LOG:all to see its lines (docs/CLOUDFLARE.md § Worker logging)."

      - alert: EdgeWorkerCPUNearLimit
        expr: vaultaire_edge_worker_cpu_p99_seconds{script="stored-s3-edge"} > 240
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The edge Worker's CPU p99 is near its limit"
          description: "The p99 CPU time of stored-s3-edge invocations of the last 15 minutes is above 240 s, 80 % of wrangler.toml's cpu_ms = 300000: a codec write of a large body is close to being cut (exceededCpu)."

      - alert: DataPlaneEdgePathUnused
        expr: |
          vaultaire_synthetic_check_edge_enabled == 1
          and on()
          sum(increase(vaultaire_data_plane_admits_total{host="edge",outcome=~"admitted.*"}[2h])) < 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No transfer has taken the edge path in 2 hours"
          description: "The canary's edge leg runs (SYNTHETIC_CHECK_EDGE_EVERY) and yet the origin admitted nothing for the Worker in 2 hours: the Worker passes everything through (its admit fails or its route is gone), or the canary's tenant lost edge_ingest. curl -s localhost:$(cat /opt/vaultaire/ACTIVE_PORT)/metrics | grep 'vaultaire_data_plane_pass_through_total{host=\"edge\"'."
