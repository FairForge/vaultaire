# Upload admission guards — install to /etc/prometheus/rules/ (see README).
#
# Series come from the app's /metrics (WP-R10-8 Part C,
# internal/api/multipart_staging_guard.go):
#   vaultaire_multipart_staging_refusals_total   UploadParts answered 503 SlowDown because the
#                                                staging filesystem would fall below its floor
#   vaultaire_multipart_staging_free_bytes       free bytes there at the last UploadPart's check
# and (WP-R2-6, Stage 1a Prompt 14 Part C, internal/api/chunk_put_budget.go):
#   vaultaire_chunk_put_budget_refusals_total    chunked writes (a > 64 MiB PUT, a Complete placed
#                                                chunked) answered 503 SlowDown because the process-
#                                                wide chunk-buffer budget could not spare one worker's
#                                                buffers (48 MiB) within 2 s — before any chunk was stored
#   vaultaire_chunk_put_budget_bytes_in_use      bytes of that budget held now
#   vaultaire_chunk_put_budget_bytes             its size (CHUNK_PUT_BUDGET_BYTES; a quarter of
#                                                GOMEMLIMIT, else 2 GiB)
#
# ChunkPutBudgetRefusing: the box is taking more concurrent large uploads
# than its memory budget allows; a write that got in degrades to fewer chunks
# in flight first, so a refusal means the budget is spent by writes already
# running. Clients retry (503 + Retry-After 30). The knobs: the budget
# (CHUNK_PUT_BUDGET_BYTES, with GOMEMLIMIT and the unit's MemoryHigh= — the
# owner item in docs/DEPLOY.md), CHUNK_PUT_CONCURRENCY. Counted in
# vaultaire_errors_total too (real saturation, unlike the egress guard's 503).
#
# Every part is reserved against its tenant's quota before it is staged, but
# the staging filesystem is shared: N tenants × their quotas can still fill
# it. The floor is MULTIPART_STAGING_MIN_FREE (default max(10 %, min(50 GiB,
# 50 %)) of the filesystem: 30 GiB of prod's 61 GiB tmpfs /tmp, i.e. RAM).
#
# Triage when MultipartStagingRefusing fires: clients retry the part (503 +
# Retry-After), nothing is lost, but large uploads stall.
#   df -h /tmp; du -sh /tmp/vaultaire-multipart
#   psql: SELECT tenant_id, COUNT(*), pg_size_pretty(SUM(reserved_bytes)) FROM multipart_uploads
#         WHERE status = 'active' GROUP BY 1 ORDER BY SUM(reserved_bytes) DESC LIMIT 10;
# One tenant holding most of it: their uploads end with an Abort, or the
# reaper after 48 h idle (MULTIPART_ABANDON_HOURS). The lasting fix is
# WP-R3-5: stage on the data disk instead of the tmpfs.
groups:
  - name: vaultaire-multipart
    rules:
      - alert: MultipartStagingRefusing
        expr: increase(vaultaire_multipart_staging_refusals_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "UploadParts are refused: the multipart staging filesystem is near its floor"
          description: "{{ $value }} part(s) answered 503 SlowDown in 15 min. Free: vaultaire_multipart_staging_free_bytes. Find the uploads holding it (multipart_uploads.reserved_bytes) — see the triage in deploy/monitoring/vaultaire-multipart.yml."

      # The process-wide chunk-buffer budget could not admit a large upload
      # (WP-R2-6, Prompt 14 Part C): writes already running hold it all.
      - alert: ChunkPutBudgetRefusing
        expr: increase(vaultaire_chunk_put_budget_refusals_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Large uploads are refused: the chunk-buffer budget is spent"
          description: "{{ $value }} chunked write(s) answered 503 SlowDown in 15 min: the process budget for chunked PUTs' buffers (vaultaire_chunk_put_budget_bytes, CHUNK_PUT_BUDGET_BYTES) could not spare one worker's 48 MiB within 2 s. In use: vaultaire_chunk_put_budget_bytes_in_use. Writes that got in run narrower first, so this is the box at its memory bound — raise the budget with GOMEMLIMIT and the unit's MemoryHigh= (docs/DEPLOY.md), or accept the retries."
