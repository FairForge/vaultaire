# Background jobs — install to /etc/prometheus/rules/ (see README).
#
# Series come from the app's /metrics (internal/api/jobs.go, WP-R13-3):
#   vaultaire_job_last_success_timestamp_seconds{job_name}   unix time of the job's last successful run,
#                                                        READ FROM job_runs (0 = never succeeded)
#   vaultaire_job_runs_total{job_name,outcome}          runs in this process: ok / error / interrupted
#   vaultaire_account_deletion_tenants_total{result}    erased / deferred / cancelled / settling (rows erased, a lagging
#                                                        listing's walk still owed — not a failure; RB-1, erasure_settle.go)
#   vaultaire_account_deletion_realms_total{realm,outcome} recovery-realm Deletes of the runner's stage b3: deleted / invalid_auth /
#                                                        unavailable / unreachable, every configured realm at 0 from boot (RP54-3)
#   vaultaire_stale_copy_lost_writes_total{source}      objects whose bytes the delete of a stale copy removed while a
#                                                        write of the same key was in flight (reclaim / delete / overwrite)
#   vaultaire_account_exports_total{result}             GDPR exports: completed / retried / failed / expired (WP-R10-3b)
#   vaultaire_key_rotation_pending{kind}                encrypted chunks / SSE-S3 blobs (head rows + retained versions) below their tenant's newest key
#                                                       (kind="whole" keeps the skipped ones — tape, demotion, parity, exports — so only "chunk" is alerted on)
#                                                        version, READ FROM the tables (WP-R8-1)
#   vaultaire_tenant_keys_unwrap_failures               tenant key versions no configured master key opens (boot check)
#
# The last-success series is read from the database, not kept in memory: a
# process that has just started reports the success of the process before it.
# The gauges it replaces (vaultaire_retention_last_run_timestamp_seconds,
# vaultaire_account_deletion_last_run_timestamp_seconds) were set only after a
# run in the same process and read 0 after every deploy — RetentionJobStale,
# written on one of them with `for: 0m`, was true after every deploy until the
# next 03:30 UTC. Both gauges are gone; RetentionJobStale is JobStale{job_name="retention"}.
#
# The label is job_name, not job: Prometheus puts its own `job` (the scrape
# job, "vaultaire") on every series and stores a scraped `job` label as
# `exported_job` — a rule on {job="retention"} would never match.
#
# Daily jobs (UTC): inventory 00:30, chunk_orphans 01:30, dedup_gc 02:30, retention 03:30,
# account_deletion 04:30, routing_truth 05:30, smart_demotion 06:30, entitlement_lapse 07:30. Each catches up a few minutes
# after a start when job_runs has no success since its last scheduled time,
# and re-checks every hour. A run is "error" (and retried at the next hourly
# check) only when the run itself failed; one object, chunk, report or tenant
# that failed is a note on an "ok" run — except account_deletion, where a
# deferred tenant is the failure on purpose (AccountDeletionDeferred).
#
# Triage:
#   curl -s -H "Authorization: Bearer <admin JWT>" https://stored.ge/api/v1/admin/jobs | jq .
#   journalctl -u 'vaultaire@*' | grep -E '"job run (failed|interrupted|completed)"'
#   POST /api/v1/admin/jobs/<job>/run     start one run now (202; 409 while one is running)
groups:
  - name: vaultaire-jobs
    rules:
      - alert: JobStale
        expr: (time() - vaultaire_job_last_success_timestamp_seconds{job_name=~"inventory|chunk_orphans|dedup_gc|retention|account_deletion|routing_truth|smart_demotion|entitlement_lapse|backend_capacity|catalogue_filter|sandbox_purge"}) > 36 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Daily job {{ $labels.job_name }} has not succeeded in 36 hours"
          description: "{{ $labels.job_name }} last succeeded {{ $value | humanizeDuration }} ago (a value near the age of the epoch means it has never succeeded). It is due once a day and retried hourly while it fails. GET /api/v1/admin/jobs shows the last outcome and error; journalctl -u 'vaultaire@*' | grep 'job run'."

      - alert: PeriodicJobStale
        expr: (time() - vaultaire_job_last_success_timestamp_seconds{job_name=~"multipart_reaper|edge_admit_reaper|cdn_rollup|idempotency_cleanup|sts_cleanup|session_cleanup|bandwidth_alerts|access_log_delivery|account_export|vault_parity|vault_tape_audit|pack_gc|stripe_gc|swift_segment_gc|key_reencrypt|retired_blobs|blob_copies|webhook_retry|payment_reminders|renewal_stops|translog_checkpoint|translog_anchor"}) > 3 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Periodic job {{ $labels.job_name }} has not succeeded in 3 hours"
          description: "{{ $labels.job_name }} runs every hour (payment_reminders too; access_log_delivery and edge_admit_reaper every 5 minutes, account_export every minute, key_reencrypt, retired_blobs, blob_copies, renewal_stops, translog_checkpoint and translog_anchor every 10 minutes, webhook_retry every 30 seconds) and last succeeded {{ $value | humanizeDuration }} ago. GET /api/v1/admin/jobs; journalctl -u 'vaultaire@*' | grep 'job run failed'."

      - alert: JobFailing
        expr: increase(vaultaire_job_runs_total{outcome="error"}[6h]) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.job_name }} failed {{ $value | humanize }} times in 6 hours"
          description: "The run itself is failing (not single items — those are notes on an ok run). The error text is in GET /api/v1/admin/jobs (last_error) and in the 'job run failed' log line."

      - alert: AccountDeletionDeferred
        expr: increase(vaultaire_account_deletion_tenants_total{result="deferred"}[2h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "An account erasure is being deferred"
          description: "The account-deletion runner could not finish a tenant whose grace period ended (Stripe refused the cancel, a backend refused a delete, or STRIPE_SECRET_KEY is unset with a subscription on the row). It retries every hour; the erasure is owed on its date. GET /api/v1/admin/jobs → account_deletion.last_error names the tenant and the reason."

      # RP54-3 (Stage 1a Prompt 39 Part 0). A recovery realm that does not
      # confirm a Delete defers the tenant (stage b3, recovery_erasure.go), and
      # AccountDeletionDeferred says a tenant waits — this one names the realm
      # and why. invalid_auth never heals by retrying: the realm's token key
      # was rotated without RECOVERY_TOKEN_KEYS, or its clock is behind ours
      # past its 5 s leeway on nbf. unreachable is asked once per run (RP54-4).
      - alert: AccountDeletionRealmRefusing
        expr: sum by (realm, outcome) (increase(vaultaire_account_deletion_realms_total{outcome!="deleted"}[2h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Recovery realm {{ $labels.realm }} did not confirm an account erasure's Delete ({{ $labels.outcome }})"
          description: "The account-deletion runner deferred a tenant because realm {{ $labels.realm }} answered {{ $labels.outcome }} in the last 2 h. invalid_auth: the realm refused the token — compare its token key with RECOVERY_TOKEN_KEYS and its clock with ours (nbf, 5 s leeway); it will not heal by itself. unavailable: it answered 5xx or Unavailable. unreachable: no answer at all — the run stopped asking it after the first tenant. The erasure is owed on its date; GET /api/v1/admin/jobs → account_deletion.last_error names the tenant."

      # WP-R13-2 (Review R13-06). A stale copy of an object — the hot copy of a
      # demoted object, the blob an overwrite left on another backend — is
      # deleted at a key a customer may be writing at that moment; a PUT's
      # bytes land before its head-row transaction, so no lock orders the two
      # (WP-R2-1 closes it). When it happens the object has a head row and no
      # bytes: every GET fails until it is uploaded again. The Error log line
      # "stale copy: the delete of a stale copy removed a write" names the
      # tenant, bucket and key — tell the customer.
      - alert: StaleCopyLostWrite
        expr: increase(vaultaire_stale_copy_lost_writes_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A customer object lost its bytes to a stale-copy delete ({{ $labels.source }})"
          description: "The delete of a stale copy removed bytes a write of the same key had just stored: the object lists and HEADs but cannot be read. journalctl -u 'vaultaire@*' | grep 'stale copy: the delete of a stale copy' gives tenant, bucket and key; the customer must upload the object again. Source {{ $labels.source }}: reclaim = the smart_demotion job, delete = DeleteObject on a demoted key, overwrite = a write that replaced an object on another backend."

      # Vault parity (WP-VAULT-1, Prompt 2b.3 D2.3): an object whose protect
      # is estimated longer than a whole run (VAULT_PARITY_MAX_RUN_TIME at
      # VAULT_PARITY_PROTECT_RATE) is never started — it has no second copy
      # for as long as that lasts. A standing condition, never a failed run:
      # only this rule says so.
      - alert: VaultParityObjectTooLarge
        expr: vaultaire_vault_parity_unprotected_objects{reason="too_large"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} vault object(s) too large for a parity run"
          description: "The vault_parity job never starts a protect estimated longer than a whole run, so these objects have no parity copy. GET /api/v1/admin/jobs → vault_parity result.notes names the first 20. Raise VAULT_PARITY_MAX_RUN_TIME (or the rate estimate) or accept them unprotected."

      # The parity scrub (WP-VAULT-2, docs/reviews/WP-VAULT-2.md): every
      # complete row's shards are read end to end once per
      # VAULT_PARITY_SCRUB_CYCLE and one object per pass is rebuilt from the
      # parity alone. A failed shard or rebuild re-protects its row (the next
      # protect rewrites four shards), so a finding is a warning, not a page —
      # unless the leg keeps losing shards: then the second copy is not there.
      - alert: VaultParityShardUnreadable
        expr: sum by (outcome) (increase(vaultaire_vault_parity_scrub_shards_total{outcome=~"unreadable|missing|corrupt"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The parity scrub found {{ $value }} {{ $labels.outcome }} shard(s) in the last hour"
          description: "A Vault parity shard could not be read back as written. Its row is re-protected by the next vault_parity run. journalctl -u 'vaultaire@*' | grep 'vault parity scrub: a parity shard failed' names tenant, bucket, key, leg and shard; GET /api/v1/admin/jobs → vault_parity result.scrub_findings. Repeated findings on one leg mean the leg is losing bytes: check the leg's backend (bench-results/LYVE-READ-FAULT-2026-10-21.md)."
      - alert: VaultParityRebuildMismatch
        expr: increase(vaultaire_vault_parity_rebuilds_total{outcome="mismatch"}[6h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A Vault object did not rebuild from its parity alone"
          description: "The scrub rebuilt an object from its four parity shards and the bytes did not hash to what protect read from tape: that parity was never a copy. The row is re-protected. If it recurs, the encoder or the leg is at fault — stop trusting the second copy until it is understood. The log line 'vault parity scrub: the parity does not rebuild the object' names the object."
      - alert: VaultParityScrubStale
        expr: vaultaire_vault_parity_complete_rows > 0 and (time() - vaultaire_vault_parity_scrub_last_timestamp_seconds) > 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The parity scrub has read no row clean in 24 h"
          description: "Complete parity rows exist and no scrub pass read one clean for a day: the job is not running, its leg is unreachable (rows skipped — result.scrub_skipped), or every row fails. GET /api/v1/admin/jobs → vault_parity."
      - alert: VaultParityScrubBacklog
        expr: vaultaire_vault_parity_scrub_backlog > 0
        for: 48h
        labels:
          severity: info
        annotations:
          summary: "{{ $value }} parity row(s) not scrubbed within the cycle"
          description: "Rows the scrub has not read clean for longer than VAULT_PARITY_SCRUB_CYCLE + 7 days: the pass's budget (the footprint's share of the cycle) does not fit its 10 min slice at the leg's speed, or the leg is skipped. Lengthen VAULT_PARITY_SCRUB_CYCLE or shorten VAULT_PARITY_SCRUB_EVERY."
      # The weekly tape audit (WP-VAULT-2 A4): one vault object a week is read
      # back from its own copy (restored from tape first when it is there)
      # and hashed against what protect read. A mismatch means the first copy
      # is not what was written.
      - alert: VaultTapeAuditFailed
        expr: sum by (outcome) (increase(vaultaire_vault_tape_audit_total{outcome=~"mismatch|error"}[8d])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The weekly tape audit ended in {{ $labels.outcome }}"
          description: "GET /api/v1/admin/jobs → vault_tape_audit result names the object and the detail; the Warn line 'vault tape audit:' too. mismatch: the object's own copy does not hash to what was stored — read it again, compare with a rebuild from its parity (the GET fallback serves it while Geyser fails), and raise it with Geyser. error: no answer, a refused restore, or a restore that did not land in 48 h."
      - alert: VaultTapeAuditStale
        expr: vaultaire_vault_parity_complete_rows > 0 and (time() - vaultaire_vault_tape_audit_last_ok_timestamp_seconds) > 9 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No clean tape audit in 9 days"
          description: "Vault objects have parity copies and no weekly audit has read one back clean from its own copy for 9 days: the job is not registered or not running, a restore keeps failing, or every audit mismatched. GET /api/v1/admin/jobs → vault_tape_audit."
      - alert: VaultParityRestoreStuck
        expr: vaultaire_vault_parity_restores_stuck > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $value }} vault object(s) waiting more than 24 h for a tape restore"
          description: "The vault_parity job found these objects on tape, asked Geyser to restore them and still has no parity copy a day later (LA2 restored a 2 GiB object in 459 s on 2026-10-24). SELECT tenant_id, bucket, object_key, restore_requested_at, last_error FROM vault_parity WHERE state <> 'complete' AND restore_requested_at IS NOT NULL; check the restore in the Geyser console."

      # Tenant key versions (WP-R8-1, docs/ENCRYPTION.md). A key row that
      # opens under neither ENCRYPTION_MASTER_KEY nor _PREVIOUS makes every
      # encrypted read of its tenant a 500 (never ciphertext): the wrong master
      # key is configured, or a re-key removed PREVIOUS before every slot had
      # booted with it.
      - alert: TenantKeysUnwrapFailing
        expr: vaultaire_tenant_keys_unwrap_failures > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} tenant key version(s) open under no configured master key"
          description: "Those tenants' encrypted objects answer 500 until the right key is set. journalctl -u 'vaultaire@*' | grep 'open under no configured master key' names the first 50 (tenant vN). Put the old key back as ENCRYPTION_MASTER_KEY_PREVIOUS and restart (sudo vaultaire-switch restart): the boot re-wraps them."

      # After a rotation the key_reencrypt job moves the tenant's chunks onto
      # the new version (KEY_REENCRYPT_MAX_GB_PER_RUN per 10-minute run). A
      # chunk backlog that does not drain in a day is a job that cannot read
      # or write the chunks. The whole-object backlog (kind="whole") waits for
      # WP-R2-1 and is not alerted on.
      - alert: KeyReencryptBacklogStuck
        expr: vaultaire_key_rotation_pending{kind="chunk"} > 0 and delta(vaultaire_key_rotation_pending{kind="chunk"}[6h]) >= 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} chunk(s) still on an old tenant key version after a day"
          description: "The key_reencrypt job is not moving them. GET /api/v1/admin/jobs → key_reencrypt (result.errors, last_error); journalctl -u 'vaultaire@*' | grep 'key re-encrypt'."

      - alert: RetiredBlobsBacklogStuck
        expr: vaultaire_retired_blobs_backlog > 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} retired whole-object blob(s) past their grace for 6 hours"
          description: "Blobs a write displaced, a version delete released or a failed write left (retired_blobs) are due and the retired_blobs job is not deleting them: it is not running, their backend is unregistered or its breaker open (result.skipped_backends), or the deletes fail. Costs storage, never data. GET /api/v1/admin/jobs → retired_blobs; journalctl -u 'vaultaire@*' | grep 'retired blob'."
