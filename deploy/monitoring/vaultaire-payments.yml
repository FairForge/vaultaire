# Payments — install to /etc/prometheus/rules/ (see README § Installing a rules file).
# WP-PAY-3 (Stage 1a Prompt 20), docs/PAYMENTS.md § 7.
#
# Series come from the app's /metrics:
#   vaultaire_payment_provider_ready{provider}            1 while the provider can take a payment (configured ∧ verified);
#                                                          0 while unready AND while pending (configured, verification not
#                                                          completed — the minute after a boot; Part 0 of Prompt 20)
#   vaultaire_payment_provider_enabled{provider}          1 while flag pay_<provider> is on globally (its global row or default)
#   vaultaire_payment_webhook_total{provider,outcome}     webhook deliveries: ok / duplicate / rejected / error (500 = retried);
#                                                          BTCPay also foreign / settled_unpaid / mark_refused / fetch_refused
#                                                          (200, nothing applied, the claim released — RP30-3/4/5; every
#                                                          btcpay pair at 0 from boot)
#   vaultaire_entitlement_lapse_skipped_unready           the last entitlement_lapse run's skipped_unready, READ FROM job_runs.result
#   vaultaire_stripe_house_invalid_total                  Stripe subscriptions that describe no valid house (RP20-4; unlabelled, 0 from boot)
#   vaultaire_payment_reminders_total{step,outcome}       renewal reminder mails: sent / failed per step (every pair at 0 from boot)
#   vaultaire_payments_total{provider,kind,outcome}       ledger writes (no rule on a failed charge: Stripe's dunning);
#                                                          kind="refund",outcome="mismatch" = a Stripe refund notice that
#                                                          disagrees with the ledger's row under its id (RP30-7)
#   vaultaire_entitlements_expiring{window}               7d / 30d / in_grace (the code's windows; the design wrote 14d/3d/grace)
#   vaultaire_payments_double_period_total{provider}      WP-PAY-5: a settled charge whose period overlaps another provider's
#                                                          settled charge of the tenant (paid twice; every provider at 0 from boot)
#   vaultaire_btcpay_unconfirmable_total                  RP37-6: BTCPay fetches with paidAmount > 0 and no payments[] (unlabelled,
#                                                          0 from boot) — nothing credited, a person must look
#   vaultaire_payment_renewal_stops_pending               WP-PAY-5: subscriptions a provider switch took the house from whose
#                                                          stop the provider has not confirmed (READ FROM payment_events on scrape)
#
# Prod today: no Stripe key (ready 0) and pay_stripe off (enabled 0) → PaymentProviderDown is silent; it fires only once
# a key is set, the flag is on and the prices do not verify for 15 min (or Stripe's verification is never reached).
#
# Triage:
#   curl -s https://stored.ge/metrics | grep -E 'vaultaire_payment_|vaultaire_entitlement|vaultaire_stripe_house'
#   journalctl -u 'vaultaire@*' | grep -E 'house prices|stripe webhook|payment reminder|entitlement lapse'
#   GET /api/v1/admin/jobs → entitlement_lapse.result, payment_reminders.result
groups:
  - name: vaultaire-payments
    rules:
      # A provider customers may use (flag on) that cannot take a payment:
      # checkout is closed and the lapse job keeps every house of that
      # provider — nothing is lost, but nothing is sold.
      - alert: PaymentProviderDown
        expr: (vaultaire_payment_provider_ready == 0) and on (provider) (vaultaire_payment_provider_enabled == 1)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Payment provider {{ $labels.provider }} is not ready while its flag is on"
          description: "vaultaire_payment_provider_ready{provider=\"{{ $labels.provider }}\"} has been 0 for 15 minutes with pay_{{ $labels.provider }} on: no checkout can start and the entitlement_lapse job skips its houses. Stripe: the key is missing or revoked, or a price no longer matches prices.json — journalctl -u 'vaultaire@*' | grep 'house prices' names the price; fix it in the Stripe dashboard, never in code."

      # Webhook deliveries answered 500 (left for the provider to retry):
      # three or more in 15 minutes and at least one in five.
      - alert: PaymentWebhookFailing
        # The ratio first: `and` keeps its LEFT side's value, which the
        # summary prints as a percentage (it printed the error count as
        # "300%" with the count first — found by promtool, Prompt 25).
        expr: |
          sum by (provider) (increase(vaultaire_payment_webhook_total{outcome="error"}[15m]))
            / clamp_min(sum by (provider) (increase(vaultaire_payment_webhook_total{outcome=~"ok|duplicate|error"}[15m])), 1) > 0.2
          and
          sum by (provider) (increase(vaultaire_payment_webhook_total{outcome="error"}[15m])) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.provider }} webhooks are failing ({{ $value | humanizePercentage }} of deliveries in 15 min)"
          description: "Deliveries from {{ $labels.provider }} are answered 500 and retried by the provider; houses bought meanwhile are not applied until a delivery succeeds. journalctl -u 'vaultaire@*' | grep 'stripe webhook' gives the event id and the error (a claim lock timeout, a database error, a fetch of the subscription that failed)."

      # The lapse job skipped rows on two consecutive daily runs because
      # their provider was unready in the last 24 h (a standing outage, or
      # a readiness that never settles).
      - alert: EntitlementLapseSkippedUnready
        expr: min_over_time(vaultaire_entitlement_lapse_skipped_unready[30h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "entitlement_lapse skipped {{ $value }} house(s) as provider_unready on two runs running"
          description: "A house past paid_through + grace is kept while its provider was unready in the last 24 h (by design — a house is never lost because our processor was down), but two days running means the provider is not coming back by itself. GET /api/v1/admin/jobs → entitlement_lapse.result.errors names the tenants and the provider; see PaymentProviderDown."

      # RP22-8: a subscription edited at Stripe into no valid house (pin-hot
      # with no Standard under it). The event is acknowledged and the house
      # left as it was; the operator fixes the items at Stripe.
      - alert: StripeHouseInvalid
        expr: increase(vaultaire_stripe_house_invalid_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A Stripe subscription describes no valid house"
          description: "journalctl -u 'vaultaire@*' | grep 'no valid house' names the tenant, the subscription and the items; the audit row is billing.house_invalid. Fix the subscription's items in the Stripe dashboard — the next event re-grants the house."

      # A renewal reminder could not be sent (the mail provider refused, a
      # template failed): the step is retried next hour, so one failure is
      # a blip; it warns so a dead mail provider is seen before the lapse.
      - alert: PaymentRemindersFailing
        expr: sum(increase(vaultaire_payment_reminders_total{outcome="failed"}[2h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanize }} renewal reminder(s) failed to send in 2 hours"
          description: "The payment_reminders job (hourly) could not send a reminder; it retries the step every hour until it is sent or the period changes. journalctl -u 'vaultaire@*' | grep 'payment reminder' gives the tenant, the step and the mail error (EMAIL_PROVIDER, SMTP_*)."

      # RP30-5 (Stage 1a Prompt 25 Part 0): BTCPay money that arrived and
      # was NOT applied. settled_unpaid = an invoice Settled with less than
      # its amount paid (marked by hand, a store tolerance above 0 %);
      # mark_refused = the paid-late automation's mark refused with a 4xx;
      # fetch_refused = a Greenfield read refused (a wrong key). Each was
      # answered 200 so the store's webhook queue is not stalled for ~71 min
      # (RP30-4) — so nothing retries it: a person must look.
      - alert: BTCPayPaymentNotApplied
        expr: sum by (outcome) (increase(vaultaire_payment_webhook_total{provider="btcpay",outcome=~"settled_unpaid|mark_refused|fetch_refused"}[1h])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A BTCPay delivery was acknowledged without being applied ({{ $labels.outcome }})"
          description: "journalctl -u 'vaultaire@*' -o cat | grep 'btcpay webhook' names the invoice and the tenant. settled_unpaid: BTCPay says Settled but paidAmount < amount — check the store's payment tolerance (must be 0 %) and whether an operator marked it; record a manual payment if the money is real. mark_refused: mark the late-paid invoice Settled by hand in BTCPay (the InvoiceSettled that follows grants it). fetch_refused: the store key is wrong or lost a permission (cancreateinvoice, canviewinvoices, canmodifyinvoices) — fix it, then redeliver the delivery from the BTCPay UI (it is handled fresh)."

      # RP37-6 (Stage 1a Prompt 30): a BTCPay invoice says money arrived
      # (paidAmount > 0) but lists no payments — a 1.x-shaped answer — so
      # no part of it can be shown confirmed and none is credited or
      # granted. The money is stuck until a person looks.
      - alert: BTCPayPaymentUnconfirmable
        expr: sum(increase(vaultaire_btcpay_unconfirmable_total[1h])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A BTCPay invoice holds money that cannot be shown confirmed (no payments listed)"
          description: "journalctl -u 'vaultaire@*' -o cat | grep 'lists no payments' names the invoice and the tenant. Nothing was credited or granted. Open the invoice in BTCPay: if its payments are confirmed, record a manual payment or credit; check that the server runs BTCPay 2.x (the Greenfield payment-methods answer must list payments[])."

      # A verified BTCPay delivery for an invoice our ledger does not know,
      # or whose metadata/amount disagrees with our row. One is a stray
      # (a test invoice made in the BTCPay UI); a stream is a second store
      # or webhook pointed here.
      - alert: BTCPayWebhookForeign
        expr: sum(increase(vaultaire_payment_webhook_total{provider="btcpay",outcome="foreign"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "BTCPay deliveries for invoices the ledger does not match (last hour)"
          description: "journalctl -u 'vaultaire@*' -o cat | grep 'btcpay webhook' gives the invoice and why (unknown here, unknown at BTCPay, metadata tenant, amount). The store must have ONE webhook, ever (delete the old URL before adding a new one). Nothing was applied; a redelivery after a fix is handled fresh."

      # RP30-7: Stripe reported a refund whose amount (or charge) differs
      # from the row recorded under its re_ id — usually an operator typed
      # the amount first. The ledger keeps the operator's row.
      - alert: StripeRefundMismatch
        expr: sum(increase(vaultaire_payments_total{provider="stripe",kind="refund",outcome="mismatch"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A Stripe refund disagrees with the ledger's row under its id"
          description: "journalctl -u 'vaultaire@*' -o cat | grep 'refund disagrees' names the tenant, the re_ id and both amounts. Correct the ledger by hand (an adjustment) to what Stripe actually refunded."

      # WP-PAY-5 item 3 (docs/PAYMENTS.md § 2.5 point 5): a customer paid
      # twice for the same dates — two providers (the portal race, a
      # renewal that landed before its stop). The house was granted; one of
      # the two is refunded by hand. The operator also gets a mail.
      - alert: PaymentDoublePeriod
        expr: sum by (provider) (increase(vaultaire_payments_double_period_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A customer paid twice for overlapping dates ({{ $labels.provider }})"
          description: "The audit row billing.double_period names both ledger rows (GET /api/v1/admin/tenants/<tenant>/payments). Refund one of them with the provider, then record it with POST /api/v1/admin/tenants/<tenant>/refunds. journalctl -u 'vaultaire@*' -o cat | grep 'paid twice'."

      # WP-PAY-5 item 0 (RP30-2): a subscription the house no longer names
      # (a BTCPay payment took it over) is still not confirmed stopped after
      # an hour — the renewal_stops job asks every 10 minutes; while it is
      # pending it may bill again.
      - alert: RenewalStopsPending
        expr: vaultaire_payment_renewal_stops_pending > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} subscription(s) a provider switch replaced are not confirmed stopped"
          description: "GET /api/v1/admin/jobs → renewal_stops.result.errors names each provider:subscription and why (Stripe not configured, an API error). Stop it by hand in the Stripe dashboard (cancel at period end) — the next run then reads it as stopped. While pending it may bill a period the customer already paid (PaymentDoublePeriod)."
