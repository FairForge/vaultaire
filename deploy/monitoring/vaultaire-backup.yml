# Database backups — install to /etc/prometheus/rules/ (see README).
#
# Series are written by deploy/scripts/pg-backup.sh (cron 03:00 UTC, user1) into
# its own directory /opt/vaultaire/metrics (user1), read by node_exporter through
# root-owned symlinks in its textfile directory /var/lib/prometheus/node-exporter
# (deploy/monitoring/README.md "Backup metrics"; `node_textfile_scrape_error` 0 = read):
#   vaultaire_backup_last_success_timestamp_seconds         the pg_dump passed its size + DDL asserts
#   vaultaire_backup_offbox_last_success_timestamp_seconds  the dump is on Sync.com, size verified
#   vaultaire_backup_offbox2_last_success_timestamp_seconds the dump is on Blomp (rclone crypt), size verified
#                                                           — optional leg, never fails the run (warning)
#   vaultaire_backup_run_last_success_timestamp_seconds     the whole run finished (written last):
#                                                           configs tar — the only backup of .env —
#                                                           rules tar + upload, retention
#   vaultaire_backup_offbox_retention_undeleted_files       old files (past 30 days, by the date in
#   vaultaire_backup_offbox2_retention_undeleted_files      the name) the last Sync / Blomp retention
#                                                           pass could not delete — a count, not a
#                                                           timestamp (RP54-6, Prompt 39 Part 0)
#   vaultaire_backup_offbox_retention_last_run_timestamp_seconds   the Sync / Blomp retention
#   vaultaire_backup_offbox2_retention_last_run_timestamp_seconds  pass listed its leg and tried
#                                                           every old file — what makes the
#                                                           count above fresh (RP55-1, Prompt 40)
#   vaultaire_backup_dump_encrypted                         1 = the last dump was sealed with age
#                                                           before it reached disk, 0 = plaintext
#                                                           (no recipients file; WP-P42, plan 43.7)
#
# A run that fails writes nothing — the timestamps simply age. 26 h = one daily
# run missed with two hours of slack; `or absent(...)` covers a box where the
# script never wrote the file (new install, directory not writable by user1,
# node_exporter without the textfile collector).
#
# Triage:
#   tail /opt/vaultaire/logs/backup.log          BACKUP FAILED - stage=<stage>: … says which stage
#   /opt/vaultaire/bin/pg-backup.sh               re-run by hand as user1
#   ls -la /opt/vaultaire/metrics/                the three .prom files, 0644
#   ls -la /var/lib/prometheus/node-exporter/     the three symlinks to them (root:root dir 0755)
groups:
  - name: vaultaire-backup
    rules:
      - alert: BackupStale
        expr: (time() - vaultaire_backup_last_success_timestamp_seconds) > 26 * 3600 or absent(vaultaire_backup_last_success_timestamp_seconds)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful database dump in > 26 h"
          description: "pg-backup.sh has not reported a dump that passed its asserts for over 26 hours (or never has on this box). Check /opt/vaultaire/logs/backup.log on slc-vaultaire-01 and re-run /opt/vaultaire/bin/pg-backup.sh."

      - alert: BackupOffboxStale
        expr: (time() - vaultaire_backup_offbox_last_success_timestamp_seconds) > 26 * 3600 or absent(vaultaire_backup_offbox_last_success_timestamp_seconds)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No off-box copy of the database dump in > 26 h"
          description: "The dump has not reached Sync.com with a verified size for over 26 hours: a disk loss would take the only copy. Check the OFFBOX lines in /opt/vaultaire/logs/backup.log (sync-webdav bridge on :4918, rclone) and re-run /opt/vaultaire/bin/pg-backup.sh."

      - alert: BackupRunIncomplete
        expr: (time() - vaultaire_backup_run_last_success_timestamp_seconds) > 26 * 3600 or absent(vaultaire_backup_run_last_success_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No complete backup run in > 26 h (configs/rules tar or retention failing)"
          description: "The dump may be fine (BackupStale / BackupOffboxStale say), but a later stage of pg-backup.sh has failed for over 26 hours: the configs tar is the only backup of /opt/vaultaire/configs/.env, the rules tar is the only copy of the installed alert rules, and a failed retention fills the Sync account. `grep 'BACKUP FAILED' /opt/vaultaire/logs/backup.log | tail` names the stage."

      - alert: BackupSecondOffboxStale
        expr: (time() - vaultaire_backup_offbox2_last_success_timestamp_seconds) > 26 * 3600 or absent(vaultaire_backup_offbox2_last_success_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No second off-box copy (Blomp) of the database dump in > 26 h"
          description: "The dump has not reached Blomp (rclone crypt remote) with a verified size for over 26 hours. Sync still holds the off-box copy (BackupOffboxStale says), so this is a warning: `grep OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names the step (login from BLOMP_* in .env, crypt remote in configs/blomp-backup.env, Blomp 503s or a full account)."
      - alert: BackupOffboxRetentionStuck
        # A count per leg, labelled `leg` so the two alerts never share a label set. The Sync
        # leg also fails the run (BackupRunIncomplete); the Blomp leg never does — this is
        # the only signal that a backup holding deleted records outlives its 30 days there.
        expr: label_replace(vaultaire_backup_offbox_retention_undeleted_files > 0, "leg", "sync", "", "") or label_replace(vaultaire_backup_offbox2_retention_undeleted_files > 0, "leg", "blomp", "", "")
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} backup file(s) past their 30 days could not be deleted from the {{ $labels.leg }} off-box leg"
          description: "The last retention pass of pg-backup.sh listed old backups on {{ $labels.leg }} it could not delete. The privacy policy and the produce page say a deleted record stays in a backup up to 30 days: that holds only while this is 0. `grep -e 'could not delete' -e OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names them; the next run retries every one."

      - alert: BackupOffboxRetentionNotRunning
        # RP55-1 (Stage 1a Prompt 40): a retention pass whose listing fails writes no
        # undeleted-files count, so BackupOffboxRetentionStuck keeps reading the last pass that
        # listed — 0 for ever while the leg fills. The pass that listed says when; > 26 h (one
        # daily run missed with two hours of slack) or never = the count is not evidence.
        expr: label_replace((time() - vaultaire_backup_offbox_retention_last_run_timestamp_seconds) > 26 * 3600, "leg", "sync", "", "") or label_replace(absent(vaultaire_backup_offbox_retention_last_run_timestamp_seconds), "leg", "sync", "", "") or label_replace((time() - vaultaire_backup_offbox2_retention_last_run_timestamp_seconds) > 26 * 3600, "leg", "blomp", "", "") or label_replace(absent(vaultaire_backup_offbox2_retention_last_run_timestamp_seconds), "leg", "blomp", "", "")
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.leg }} off-box leg's backup retention has not listed it in > 26 h"
          description: "pg-backup.sh's retention pass for {{ $labels.leg }} has not listed the leg for over 26 hours (or never has on this box), so nothing past its 30 days is being deleted there and BackupOffboxRetentionStuck reads an old count. The privacy policy and the produce page say a deleted record stays in a backup up to 30 days. `grep -e 'listing' -e OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names the failure."

      - alert: BackupDumpPlaintext
        # WP-P42 (plan 43.7, TRUST.md item 12): the on-box dump is kept 7 days; without the
        # owner's recipients file it is written in plaintext — the run still succeeds, so this
        # is the signal. 26 h = one nightly run that wrote plaintext, with two hours of slack,
        # so a box mid-ceremony does not page. Absent = a pg-backup.sh that predates the gauge
        # (or no symlink in the textfile directory): it cannot claim encrypted dumps either.
        # A recipients file that is present but unusable never writes the gauge (the run
        # fails at stage=encrypt): BackupStale is that page.
        expr: vaultaire_backup_dump_encrypted == 0 or absent(vaultaire_backup_dump_encrypted)
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "The nightly database dump is written to disk in plaintext"
          description: "pg-backup.sh has not sealed the dump with age for over 26 hours (or never reported it): /opt/vaultaire/configs/backup-age-recipients.txt is absent, or the installed script predates WP-P42. Every dump on the box for 7 days is then a readable copy of the database. Put the owner's offline age public keys in that file (root 0644, public lines only — docs/DEPLOY.md § Backups); `grep 'stage=encrypt' /opt/vaultaire/logs/backup.log | tail` says what the last run saw."
