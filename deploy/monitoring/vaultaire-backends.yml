# Backend-outage alerting — install to /etc/prometheus/rules/ (see README).
#
# Series come from the app's /metrics (internal/api/prom_metrics.go):
#   vaultaire_backend_health{backend}              1/0, last probe result
#   vaultaire_backend_probe_failures_total{backend}
#   vaultaire_backend_circuit_open{backend}        engine breaker not closed
#   vaultaire_backend_write_failures_total         PUTs rejected, all durable backends failed
#
# Probes are AUTHENTICATED (signed HeadBucket for idrive/geyser, console
# RSCustomerDetails for lyve) — a revoked key trips these; a TCP dial never did.
groups:
  - name: vaultaire-backends
    rules:
      # Primary/durable backends: a failing signed probe for 5 minutes means
      # PUTs are 503ing (fail-loudly) or reads are failing. Page.
      - alert: BackendProbeFailing
        expr: vaultaire_backend_health{backend!~"lyve|permafrost|sync"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend {{ $labels.backend }} failing authenticated probe"
          description: "{{ $labels.backend }} has failed its signed health probe for 5+ minutes (dead key? account suspended? outage?). Check `curl -s localhost:8000/health/backends` on the box for last_error."

      # Lyve is the fallback leg, and its console action intermittently 403s
      # for root in ~5-minute windows — so a longer `for` and a warning.
      - alert: LyveProbeFailing
        expr: vaultaire_backend_health{backend="lyve"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lyve console probe failing"
          description: "RSCustomerDetails (root key) has failed for 15+ minutes — beyond the known 403 propagation windows. Check the Lyve console / key status."

      # Permafrost (OneDrive fleet) is an internal parity leg, not
      # customer-facing, and its probe covers one rotating fleet account per
      # tick (Review R7-18/19) — a warning, not a page.
      - alert: PermafrostProbeFailing
        expr: vaultaire_backend_health{backend="permafrost"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Permafrost (OneDrive fleet) probe failing"
          description: "The authenticated Graph probe has failed for 15+ minutes (expired client secret? tenant throttled?). Check `curl -s localhost:8000/health/backends` for last_error and the Azure app registrations' secret expiries."

      # Sync.com's WebDAV bridge (`sync-webdav` on the box) is a target-only
      # backend holding flagged tenants' buckets only (sync_backend flag) — a
      # warning. The probe is an authenticated PROPFIND: a 401 means the
      # bridge's password changed (SYNC_WEBDAV_PASSWORD), a refused
      # connection means the daemon is down (systemctl status sync-webdav).
      - alert: SyncProbeFailing
        expr: vaultaire_backend_health{backend="sync"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sync.com WebDAV bridge probe failing"
          description: "The authenticated PROPFIND against the sync-webdav bridge has failed for 10+ minutes (with several bridges: EVERY bridge is down). Check `curl -s localhost:8000/health/backends` for last_error, `systemctl status sync-webdav` and `journalctl -u sync-webdav` on the box (401 = password changed; connection refused = daemon down; 5xx = the bridge cannot reach Sync.com)."

      # One of several Sync bridges (SYNC_WEBDAV_URLS) is down while the
      # backend stays up: reads of that bridge's keys go to another bridge
      # (and answer 503 for objects that bridge cannot see yet), WRITES of
      # its keys fail (~1/N of the sync traffic). A warning.
      - alert: SyncBridgeDown
        expr: vaultaire_webdav_bridge_up{backend="sync"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sync WebDAV bridge {{ $labels.bridge }} down"
          description: "Bridge {{ $labels.bridge }} (index into SYNC_WEBDAV_URLS) has failed its authenticated PROPFIND for 10+ minutes; the writes of its ~1/N of the keys fail meanwhile. Check `curl -s localhost:8000/health/backends`, the bridge's systemd unit and its journal (401 = that bridge's password changed: SYNC_WEBDAV_PASSWORDS; connection refused = the process is down)."

      # Two or more Sync bridges down at once (Prompt 2b.3 D1.2). One down is
      # a warning (above); with 2+ down, 2/N of the sync keys answer 503 for
      # every write and every read of a mutable name, and the engine's
      # breaker stays closed by design (the rest answers: "partial") — so
      # nothing else pages. 4 of 5 down used to be "partial" forever.
      # vaultaire_engine_partial_unavailable_total{backend="sync"} counts
      # the 503s that cost.
      - alert: SyncBridgesDown
        expr: count(vaultaire_webdav_bridge_up{backend="sync"} == 0) >= 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} Sync WebDAV bridges down"
          description: "{{ $value }} of the sync-webdav bridges have failed their authenticated PROPFIND for 5+ minutes: their keys' writes and mutable reads answer 503 (vaultaire_engine_partial_unavailable_total{backend=\"sync\"}), and the engine's sync breaker stays closed while any bridge answers. Check `systemctl status 'sync-webdav@*'`, their journals, and the /etc/hosts pin for us-api.sync.com."

      # The data path is failing while the probes pass (Prompt 2b.4 E1.1):
      # the 2b.3 D1.1 scenario — the spill directory unwritable, or the
      # 2026-10-07 Route 53 shape (PROPFIND from cache passes, GET/PUT 5xx)
      # — keeps every bridge "up" to SyncBridgesDown, so nothing paged. Each
      # partial answer is a 503 a customer saw.
      - alert: SyncPartialUnavailable
        expr: sum by (backend) (increase(vaultaire_engine_partial_unavailable_total[10m])) > 50
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.backend }}: {{ $value | printf \"%.0f\" }} partial-unavailable 503s in 10 min"
          description: "More than 50 calls in 10 minutes were answered 503 because the part of {{ $labels.backend }} holding the object is out while the rest answers (one or two Sync bridges failing on the data path; their probes may still pass). Check `journalctl -u 'vaultaire@*' | grep -i bridge`, `systemctl status 'sync-webdav@*'`, the bridges' spill directory (/var/lib/syncdav/spill) and disk, and vaultaire_webdav_requests_total{outcome!=\"ok\"} by bridge."

      # Sync refuses writes into a folder that holds 50,000 files (its hard
      # limit; folders are unlimited). Keys' `/` segments are folders, so a
      # flat bucket past 50,000 keys stops taking writes — refused as 400s
      # (the driver turns them into invalid input, never a bridge failure).
      # The gauge is the largest folder a bridge has counted (every listing,
      # and every 1,000th PUT into a folder). Warn at 40,000 (Prompt 2b A5);
      # the fix is a layout decision (a hash fan-out level), not a restart.
      - alert: SyncFolderNearFileLimit
        expr: max by (backend) (vaultaire_webdav_folder_files_max) > 40000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A {{ $labels.backend }} folder holds over 40,000 files (Sync's limit is 50,000)"
          description: "A WebDAV bridge counted more than 40,000 files in one folder ({{ $value }}). At 50,000 Sync refuses every write into it (answered 400 InvalidInput, counted in vaultaire_webdav_folder_full_total). Find the bucket (a flat key space on the sync tier) and move its writes off sync or decide the fan-out layout (Prompt 2b A5)."

      # Durable writes are being rejected. One in 10 minutes is worth a
      # heads-up (letshow writes every minute, so a real outage produces
      # several quickly); five is a page. Same alertname so the critical
      # inhibits the warning.
      - alert: BackendWriteFailures
        expr: increase(vaultaire_backend_write_failures_total[10m]) >= 1
        labels:
          severity: warning
        annotations:
          summary: "Durable backend write failures"
          description: "{{ $value | printf \"%.0f\" }} PUT(s) rejected in the last 10 minutes because every eligible durable backend failed (503 to clients)."

      - alert: BackendWriteFailures
        expr: increase(vaultaire_backend_write_failures_total[10m]) >= 5
        labels:
          severity: critical
        annotations:
          summary: "Durable backend write failures (sustained)"
          description: "{{ $value | printf \"%.0f\" }} PUTs rejected in the last 10 minutes — the primary backend is effectively down for writes."

      # A breaker that stays open means the engine is routing around a
      # backend; usually accompanied by one of the above, but not always
      # (reads-only failures).
      - alert: BackendCircuitOpen
        expr: vaultaire_backend_circuit_open == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker open for {{ $labels.backend }}"
          description: "The engine's circuit breaker for {{ $labels.backend }} has been open/half-open for 3+ minutes (5 backend failures within 60s trips it)."

      # The legacy HighErrorRate rule keyed off vaultaire_errors_total, which
      # never incremented before 2026-09-22. It now counts 5xx responses; this
      # ratio form is less noisy than the absolute rate at low traffic.
      - alert: VaultaireServerErrorRatio
        expr: (increase(vaultaire_errors_total[10m]) / clamp_min(increase(vaultaire_requests_total[10m]), 1)) > 0.05 and increase(vaultaire_errors_total[10m]) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx ratio above 5%"
          description: "{{ $value | humanizePercentage }} of requests returned 5xx over the last 10 minutes (≥10 errors)."

      # WP-R8-7. A fixed-bucket driver (idrive, lyve, geyser, r2, permafrost)
      # keys every object by the tenant in the context of the call. A call
      # that names no tenant used to be filed under t-default/ — a miss for an
      # object that exists, a write nothing finds, a delete that "succeeds" on
      # nothing (how dedup GC leaked every chunk blob). Such a call is refused
      # now; any increase is a bug in a caller. The series starts at 0 for
      # every registered backend. The "driver call refused" Error line names
      # the backend and the operation.
      - alert: DriverCallWithoutTenant
        expr: increase(vaultaire_driver_calls_without_tenant_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A driver call on {{ $labels.backend }} carried no tenant and was refused"
          description: "{{ $value | printf \"%.0f\" }} call(s) in the last hour on {{ $labels.backend }} named no tenant in their context (they would have addressed t-default/). journalctl -u 'vaultaire@*' | grep 'driver call refused' names the operation; the caller needs common.WithTenantID or engine.ChunkContext."

      # WP-R8-7. Chunk blobs written before the one address existed are read
      # from the uploading tenant's prefix until the chunk move has run
      # (POST /api/v1/admin/chunk-move?backend=idrive&dry_run=false). Reads
      # from a legacy address after the move mean a blob the move did not
      # reach: run the dry run again and read its errors.
      - alert: ChunkLegacyAddressReads
        expr: increase(vaultaire_chunk_legacy_address_reads_total[24h]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Chunk reads served from a legacy address"
          description: "{{ $value | printf \"%.0f\" }} chunk read(s) in the last 24 hours missed at the one address and were served from under a tenant's prefix. Before the chunk move this is expected; after it, POST /api/v1/admin/chunk-move?backend=<b> (a dry run) shows what is left. When the series stays at 0 the read fallback can be removed (docs/reviews/WP-R8-7.md)."
