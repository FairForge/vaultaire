# The transparency log (keystone K4, Stage 1a Prompt 28; docs/TRANSPARENCY.md)
# — install to /etc/prometheus/rules/ (see README).
#
# Series from the app's /metrics (internal/translog/logstore):
#   vaultaire_translog_size                           entries in the log           (READ FROM translog_entries on scrape)
#   vaultaire_translog_checkpoint_size                tree size of the newest checkpoint, 0 = none   (translog_checkpoints)
#   vaultaire_translog_checkpoint_timestamp_seconds   when it was signed, 0 = never                  (translog_checkpoints)
#   vaultaire_translog_signing_key_loaded             1 = this process has the signing key (credential translog_signing_key)
#   vaultaire_translog_append_failures_total{kind}    appends that failed (server_build, key_ceremony)
#   vaultaire_translog_checkpoint_refusals_total{reason}  checkpoint passes that refused to sign (RP37-11):
#       rewritten / behind_highwater / highwater_unreadable — every reason a series at 0 from boot
#   vaultaire_translog_append_refusals_total{reason}  appends refused while the log is frozen (RP42-1):
#       behind_highwater / highwater_unreadable — every reason a series at 0 from boot; NOT in append_failures_total
#   vaultaire_translog_witnesses_configured           witnesses of TRANSLOG_WITNESSES (K4c-2; 0 = none, prod until the owner's ceremony)
#   vaultaire_translog_cosigned_size                  largest checkpoint any witness cosigned, 0 = none   (translog_cosignatures)
#   vaultaire_translog_cosignature_timestamp_seconds  the newest cosignature's own timestamp, 0 = none    (translog_cosignatures)
#   vaultaire_translog_witness_cosign_total{witness,outcome}  submissions: ok / conflict / refused / bad_answer / unreachable
#   vaultaire_translog_anchored_size_by_service{kind,service}         largest checkpoint each CONFIGURED anchoring service has a row for   (translog_anchors ∩ TRANSLOG_ANCHORS)
#   vaultaire_translog_anchor_timestamp_by_service_seconds{kind,service}  when its newest anchor arrived, 0 = never
#   vaultaire_translog_anchor_oldest_pending_seconds{kind,service}        age of its oldest pending proof with no complete row, 0 = none
#
# The translog_checkpoint job signs a checkpoint every 10 min when the tree
# grew; without the key it signs nothing and nothing here fires (the key is
# an owner ceremony — until then signing_key_loaded is 0 on purpose).
#
# Triage:
#   GET /api/v1/admin/jobs → translog_checkpoint: last_error ("no signing key",
#   "unchanged") and result {size, checkpoint_size, signed, reason}.
#   journalctl -u 'vaultaire@*' | grep 'translog checkpoint: nothing signed'
#   — "does not extend checkpoint N" means the stored log no longer extends
#   the last signed tree: STOP, do not re-sign; that is the event the log
#   exists to expose (docs/TRANSPARENCY.md § After a database restore).
groups:
  - name: vaultaire-translog
    rules:
      # The key is loaded, entries exist past the newest checkpoint, and that
      # checkpoint is more than an hour old (six runs of the 10-min job):
      # the job is failing or refusing to sign.
      - alert: TranslogCheckpointStale
        expr: |
          (time() - max(vaultaire_translog_checkpoint_timestamp_seconds)) > 3600
          and on () max(vaultaire_translog_signing_key_loaded) == 1
          and on () max(vaultaire_translog_size) > max(vaultaire_translog_checkpoint_size)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Transparency log: no checkpoint signed for {{ $value | humanizeDuration }} while entries wait"
          description: "The signing key is loaded and the log has grown past its newest checkpoint, which is more than an hour old. The translog_checkpoint job (every 10 min) is failing or refusing to sign: GET /api/v1/admin/jobs; journalctl -u 'vaultaire@*' | grep 'translog checkpoint'. A 'does not extend' error is a rewritten history — never re-sign over it (docs/TRANSPARENCY.md)."

      # The job refused to sign: the stored log does not extend a tree the key
      # already signed (rewritten), the database holds fewer entries than the
      # newest tree this box signed (behind_highwater — a restore), or the
      # high-water file cannot be read. This is the one event the log exists
      # to expose, so it pages (RP37-11: before, it surfaced only as the
      # stale warning an hour later). Every pass re-proves, so it stays
      # firing until the procedure in docs/TRANSPARENCY.md is done.
      - alert: TranslogCheckpointRefused
        expr: sum by (reason) (increase(vaultaire_translog_checkpoint_refusals_total[30m])) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Transparency log: the checkpoint job refused to sign ({{ $labels.reason }})"
          description: "The translog_checkpoint job refused to sign: {{ $labels.reason }}. Do NOT re-sign and do NOT delete the high-water file. rewritten / behind_highwater after a database restore: follow docs/TRANSPARENCY.md § After a database restore BEFORE the signing key is loaded again. highwater_unreadable: check TRANSLOG_HIGHWATER_FILE (default /opt/vaultaire/data/translog/highwater). journalctl -u 'vaultaire@*' | grep 'translog checkpoint: nothing signed'."

      # An append was refused because the log is frozen (RP42-1, Stage 1a
      # Prompt 33): the database is behind the newest tree this box signed (a
      # restore) or the high-water file cannot be read. Nothing was written:
      # a producer (the boot's server_build, a ceremony, an admin read) is
      # waiting for translog-restore. The checkpoint job refuses on the same
      # condition (TranslogCheckpointRefused); this one says producers are
      # being turned away — an admin read refused, a ceremony answered 503.
      # D-P33-1: its own alert, not folded into the refusal one, because it
      # is counted where the producers are and outlives a stopped job.
      - alert: TranslogFrozen
        expr: sum by (reason) (increase(vaultaire_translog_append_refusals_total[30m])) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Transparency log: frozen — appends refused ({{ $labels.reason }})"
          description: "Appends to the transparency log are refused: {{ $labels.reason }}. The customers are served; only the log waits (server_build retried by the translog_checkpoint job, ceremonies answer 503 log_frozen, admin reads are refused). behind_highwater: re-append the lost entries with translog-restore — docs/TRANSPARENCY.md § After a database restore. highwater_unreadable: check TRANSLOG_HIGHWATER_FILE (default /opt/vaultaire/data/translog/highwater); never delete it to unfreeze."

      # K4c-2 (Stage 1a Prompt 34b): witnesses are configured, the log has
      # signed a tree no witness cosigned, and the newest cosignature of any
      # witness is more than 2 h old — every witness down or refusing for two
      # hours while the log grows. Signing never waits for a witness (the
      # checkpoint is served without the line), so this warns. An idle log
      # is not stale (its newest checkpoint is the cosigned one; the job
      # refreshes those every 6 h); no witness configured, nothing fires.
      - alert: TranslogWitnessStale
        expr: |
          (time() - max(vaultaire_translog_cosignature_timestamp_seconds)) > 7200
          and on () max(vaultaire_translog_witnesses_configured) > 0
          and on () max(vaultaire_translog_checkpoint_size) > max(vaultaire_translog_cosigned_size)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Transparency log: no fresh witness cosignature for {{ $value | humanizeDuration }} while the log grows"
          description: "The translog_checkpoint job signs, but no witness of TRANSLOG_WITNESSES has cosigned the newer checkpoints for over 2 h. The job's result names each witness's outcome (unreachable / refused / conflict / bad_answer): sudo -u postgres psql -At -d vaultaire -c \"select result from job_runs where job='translog_checkpoint'\"; vaultaire_translog_witness_cosign_total{outcome}. A conflict naming a LARGER size than the log's newest checkpoint is a restored database or a fork (docs/TRANSPARENCY.md § After a database restore)."

      # K4c-3a + RP48-1 (Stage 1a Prompt 36): per SERVICE — one dead calendar
      # of two is one point of trust left, so it warns by itself. The
      # by-service series exist only for the services of TRANSLOG_ANCHORS
      # (≤ 8; the state collector intersects translog_anchors with the
      # configured list), so none configured = no series = silent, and a
      # calendar that never answered is zeros = firing once the log signs.
      # Replaces TranslogAnchorStale (D-P36-1), whose max by (kind) fired
      # only when EVERY calendar stopped.
      - alert: TranslogAnchorServiceStale
        expr: |
          (time() - max by (kind, service) (vaultaire_translog_anchor_timestamp_by_service_seconds)) > 7200
          and on (kind, service) (max by (kind, service) (vaultaire_translog_anchored_size_by_service) < on () group_left max(vaultaire_translog_checkpoint_size))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Transparency log: no {{ $labels.kind }} anchor from {{ $labels.service }} for {{ $value | humanizeDuration }} while the log grows"
          description: "{{ $labels.service }} has not anchored the newer signed checkpoints for over 2 h while another calendar may still be fine — the log is anchored by fewer points of trust than configured. The job's result names the outcome (unreachable / refused / bad_answer — a bad_answer naming two URLs is a pool, not a calendar: fix TRANSLOG_ANCHORS): sudo -u postgres psql -At -d vaultaire -c \"select last_outcome, last_error, result from job_runs where job='translog_anchor'\"; vaultaire_translog_anchor_total{service,outcome}. docs/TRANSPARENCY.md § Anchors."

      # RP48-2: a proof pending past the re-submission horizon (48 h; Bitcoin
      # confirms in hours — the lab's completed within 3 h). The job has
      # re-submitted it once by now, so this firing means the calendar lost
      # the commitment AND the re-submission is not completing either.
      - alert: TranslogAnchorNotCompleting
        expr: max by (kind, service) (vaultaire_translog_anchor_oldest_pending_seconds) > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Transparency log: {{ $labels.service }}'s oldest pending proof is {{ $value | humanizeDuration }} old"
          description: "A proof submitted to {{ $labels.service }} has been pending past the 48 h horizon. The job re-submits such a proof once (state 'resubmitted', migration 107); this firing means neither the original nor the re-submission completes. Check the calendar, and the rows: sudo -u postgres psql -At -d vaultaire -c \"select checkpoint_size, service, state, received_at from translog_anchors order by received_at\". docs/TRANSPARENCY.md § Anchors."

      # An append failed: a server_build at boot (never blocks the boot) or a
      # ceremony entry. The producer logged an Error line with the reason.
      - alert: TranslogAppendFailing
        expr: sum by (kind) (increase(vaultaire_translog_append_failures_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Transparency log: {{ $value | humanize }} {{ $labels.kind }} append(s) failed in the last hour"
          description: "An entry that should be in the public log is not. journalctl -u 'vaultaire@*' | grep 'translog'. A server_build is retried by every translog_checkpoint run until it lands; a ceremony entry must be appended again (POST /api/v1/admin/translog/ceremony)."
