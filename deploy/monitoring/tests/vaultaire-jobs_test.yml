# promtool unit test of vaultaire-jobs.yml — the staleness rules for the
# webhook_retry interval job (WP-R11-3, Stage 1a Prompt 16 Part B).
# Run on the box (promtool is there):
#   scp deploy/monitoring/vaultaire-jobs.yml deploy/monitoring/tests/vaultaire-jobs_test.yml vaultaire-slc:/tmp/
#   ssh vaultaire-slc 'cd /tmp && promtool test rules vaultaire-jobs_test.yml'
# The rule file path below is relative to this file's directory as copied.
rule_files:
  - vaultaire-jobs.yml

evaluation_interval: 1m

tests:
  # webhook_retry last succeeded at t=0 and never again: PeriodicJobStale
  # holds once 3 h have passed and 30 min more of `for:`.
  - interval: 1m
    input_series:
      - series: 'vaultaire_job_last_success_timestamp_seconds{job_name="webhook_retry"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 3h20m
        alertname: PeriodicJobStale
        exp_alerts: []
      - eval_time: 3h35m
        alertname: PeriodicJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: webhook_retry
            exp_annotations:
              summary: "Periodic job webhook_retry has not succeeded in 3 hours"
              description: "webhook_retry runs every hour (payment_reminders too; access_log_delivery every 5 minutes, account_export every minute, key_reencrypt and retired_blobs every 10 minutes, webhook_retry every 30 seconds) and last succeeded 3h 35m 0s ago. GET /api/v1/admin/jobs; journalctl -u 'vaultaire@*' | grep 'job run failed'."
      # A daily job's rule does not watch it.
      - eval_time: 3h35m
        alertname: JobStale
        exp_alerts: []

  # A job that keeps succeeding is never stale (its timestamp follows the clock).
  - interval: 1m
    input_series:
      - series: 'vaultaire_job_last_success_timestamp_seconds{job_name="webhook_retry"}'
        values: '0+60x240'
    alert_rule_test:
      - eval_time: 4h
        alertname: PeriodicJobStale
        exp_alerts: []
