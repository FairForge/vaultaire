# promtool unit test of vaultaire-jobs.yml — the staleness rules for the
# webhook_retry interval job (WP-R11-3, Stage 1a Prompt 16 Part B).
# Run on the box (promtool is there):
#   scp deploy/monitoring/vaultaire-jobs.yml deploy/monitoring/tests/vaultaire-jobs_test.yml vaultaire-slc:/tmp/
#   ssh vaultaire-slc 'cd /tmp && promtool test rules vaultaire-jobs_test.yml'
# The rule file path below is relative to this file's directory as copied.
rule_files:
  - vaultaire-jobs.yml

evaluation_interval: 1m

tests:
  # webhook_retry last succeeded at t=0 and never again: PeriodicJobStale
  # holds once 3 h have passed and 30 min more of `for:`.
  - interval: 1m
    input_series:
      - series: 'vaultaire_job_last_success_timestamp_seconds{job_name="webhook_retry"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 3h20m
        alertname: PeriodicJobStale
        exp_alerts: []
      - eval_time: 3h35m
        alertname: PeriodicJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: webhook_retry
            exp_annotations:
              summary: "Periodic job webhook_retry has not succeeded in 3 hours"
              description: "webhook_retry runs every hour (payment_reminders too; access_log_delivery and edge_admit_reaper every 5 minutes, account_export and transfer every minute, key_reencrypt, retired_blobs, blob_copies, renewal_stops, translog_checkpoint and translog_anchor every 10 minutes, webhook_retry every 30 seconds) and last succeeded 3h 35m 0s ago. GET /api/v1/admin/jobs; journalctl -u 'vaultaire@*' | grep 'job run failed'."
      # A daily job's rule does not watch it.
      - eval_time: 3h35m
        alertname: JobStale
        exp_alerts: []

  # A job that keeps succeeding is never stale (its timestamp follows the clock).
  - interval: 1m
    input_series:
      - series: 'vaultaire_job_last_success_timestamp_seconds{job_name="webhook_retry"}'
        values: '0+60x240'
    alert_rule_test:
      - eval_time: 4h
        alertname: PeriodicJobStale
        exp_alerts: []

  # RP54-3: a realm refusing the token is named with its outcome; a realm that
  # deletes, and the other realm's zeros, stay silent.
  - interval: 1m
    input_series:
      - series: 'vaultaire_account_deletion_realms_total{realm="1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a",outcome="invalid_auth"}'
        values: '0x120 1x120'
      - series: 'vaultaire_account_deletion_realms_total{realm="1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a",outcome="deleted"}'
        values: '0+1x240'
      - series: 'vaultaire_account_deletion_realms_total{realm="1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b",outcome="unreachable"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 1h
        alertname: AccountDeletionRealmRefusing
        exp_alerts: []
      - eval_time: 3h
        alertname: AccountDeletionRealmRefusing
        exp_alerts:
          - exp_labels:
              severity: warning
              realm: 1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a
              outcome: invalid_auth
            exp_annotations:
              summary: "Recovery realm 1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a did not confirm an account erasure's Delete (invalid_auth)"
              description: "The account-deletion runner deferred a tenant because realm 1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a answered invalid_auth in the last 2 h. invalid_auth: the realm refused the token — compare its token key with RECOVERY_TOKEN_KEYS and its clock with ours (nbf, 5 s leeway); it will not heal by itself. unavailable: it answered 5xx or Unavailable. unreachable: no answer at all — the run stopped asking it after the first tenant. The erasure is owed on its date; GET /api/v1/admin/jobs → account_deletion.last_error names the tenant."
      # Two hours after the last refusal the increase is 0 again.
      - eval_time: 4h1m
        alertname: AccountDeletionRealmRefusing
        exp_alerts: []

  # WP-VAULT-3 D-V3-8: rebuilds slower than 20 MB/s, three or more an hour,
  # for an hour: VaultParityRebuildSlow. One rebuild every 10 min at 5 MB/s.
  - interval: 1m
    input_series:
      - series: 'vaultaire_vault_parity_rebuild_bytes_per_second'
        values: '5e6x240'
      - series: 'vaultaire_vault_parity_rebuild_seconds_count{phase="stream"}'
        values: '0+0.1x240'
    alert_rule_test:
      # three rebuilds are in the window from ~30 min; then the hour of `for:`
      - eval_time: 1h20m
        alertname: VaultParityRebuildSlow
        exp_alerts: []
      - eval_time: 1h45m
        alertname: VaultParityRebuildSlow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Parity rebuilds run at 5MB/s"
              description: "The last whole rebuild from the Vault parity copy ran under 20 MB/s, with at least three rebuilds in the hour, for an hour: a customer GET served from the parity (x-vaultaire-served-from: parity) is that slow. vaultaire_vault_parity_rebuild_seconds{phase} splits it (open, first_stripe, stream); vaultaire_vault_parity_shard_reads_total{leg,kind} says whether the shards were read by ranges. Check the leg's backend; bench with cmd/tools/parity-read-bench -fresh -cold-conns (bench-results/VAULT-PARITY-SERVE-2026-11.md)."

  # Slow but rare (one rebuild in the hour), and fast and busy: silent.
  - interval: 1m
    input_series:
      - series: 'vaultaire_vault_parity_rebuild_bytes_per_second'
        values: '5e6x240'
      - series: 'vaultaire_vault_parity_rebuild_seconds_count{phase="stream"}'
        values: '0+0.01x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: VaultParityRebuildSlow
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'vaultaire_vault_parity_rebuild_bytes_per_second'
        values: '150e6x240'
      - series: 'vaultaire_vault_parity_rebuild_seconds_count{phase="stream"}'
        values: '0+1x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: VaultParityRebuildSlow
        exp_alerts: []

  # HEAD's restore lookup (RP91-3): Geyser leaving a lookup unanswered for
  # 3 s, again and again for 15 min, warns; one timeout in a quiet hour does not.
  - interval: 1m
    input_series:
      - series: 'vaultaire_vault_head_restore_lookups_total{outcome="timeout"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: VaultHeadRestoreLookupsTimingOut
        exp_alerts: []
      - eval_time: 40m
        alertname: VaultHeadRestoreLookupsTimingOut
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "HEAD's restore lookups time out"
              description: "HEAD of an archive-class object asks Geyser for its x-amz-restore state (Architecture Decision 2's one exception) and Geyser has not answered within 3 s, repeatedly, for 15 min: those HEADs omit the header, so a restore poller (rclone, aws-cli s3api head-object) sees no restore state. While Geyser's breaker is open no lookup is made (outcome breaker_open). Check Geyser: the probe in /health, the driver's latency (vaultaire_driver_op_seconds{driver=\"geyser\"}), the Geyser console."
  - interval: 1m
    input_series:
      - series: 'vaultaire_vault_head_restore_lookups_total{outcome="timeout"}'
        values: '0 1 1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: VaultHeadRestoreLookupsTimingOut
        exp_alerts: []
