# promtool unit tests of vaultaire-drivers.yml: PermafrostFleetMismatch, PermafrostAccountNearFull,
# PermafrostThrottling, PermafrostHashMismatch and PermafrostFallbackWalking (WP-R7-4, Stage 1a Prompt 16
# Part A; WP-FLEET-2; WP-FLEET-3; WP-FLEET-10). Also run by deploy/monitoring/promtool-test.sh.
# Run on the box (promtool is there):
#   scp deploy/monitoring/vaultaire-drivers.yml deploy/monitoring/tests/vaultaire-drivers_test.yml vaultaire-slc:/tmp/
#   ssh vaultaire-slc 'cd /tmp && promtool test rules vaultaire-drivers_test.yml'
rule_files:
  - vaultaire-drivers.yml

evaluation_interval: 1m

tests:
  # The gauge is exported at 0 from boot (drivers.Collectors); a boot that
  # finds another order sets it to 1 for the life of the process.
  - interval: 1m
    input_series:
      - series: 'vaultaire_permafrost_fleet_mismatch{instance="slc",job="vaultaire"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: PermafrostFleetMismatch
        exp_alerts: []
      - eval_time: 4m
        alertname: PermafrostFleetMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: slc
              job: vaultaire
            exp_annotations:
              summary: "The permafrost fleet's account order changed since its markers were written"
              description: "At boot the OneDrive fleet driver found an account order (TENANT_N slots, gaps skipped) other than the one its accounts' markers recorded: a TENANT_N was removed, reordered or appended. Every object whose home account moved is read through the fleet walk. The boot's Error line 'permafrost fleet fingerprint mismatch' names the diff and the current fingerprint. Restore the TENANT_N order and restart, or rebalance and accept the new order with PERMAFROST_FLEET_ACCEPT=<fingerprint> (internal/drivers/onedrive_README.md § Fleet fingerprint)."

  # WP-FLEET-2: the fill is (total − remaining) / total — the recycle bin
  # included (remaining = total − used − deleted). tenant-1 at 70 % live +
  # 15 % bin = 85 % for over an hour fires; tenant-2 at 85 % for 30 min
  # only, then 50 %, never; used alone (70 %) would never have fired.
  - interval: 5m
    input_series:
      - series: 'vaultaire_permafrost_quota_bytes{instance="slc",job="vaultaire",account="tenant-1",kind="total"}'
        values: '1000x30'
      - series: 'vaultaire_permafrost_quota_bytes{instance="slc",job="vaultaire",account="tenant-1",kind="used"}'
        values: '700x30'
      - series: 'vaultaire_permafrost_quota_bytes{instance="slc",job="vaultaire",account="tenant-1",kind="remaining"}'
        values: '150x30'
      - series: 'vaultaire_permafrost_quota_bytes{instance="slc",job="vaultaire",account="tenant-2",kind="total"}'
        values: '1000x30'
      - series: 'vaultaire_permafrost_quota_bytes{instance="slc",job="vaultaire",account="tenant-2",kind="remaining"}'
        values: '150x6 500x24'
    alert_rule_test:
      - eval_time: 50m
        alertname: PermafrostAccountNearFull
        exp_alerts: []
      - eval_time: 70m
        alertname: PermafrostAccountNearFull
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: slc
              job: vaultaire
              account: tenant-1
            exp_annotations:
              summary: "Permafrost account tenant-1 is 85% full"
              description: "The OneDrive drive of permafrost account tenant-1 has been more than 80 % full for an hour (Graph drive.quota: total − remaining, the recycle bin included — vaultaire_permafrost_quota_bytes{kind=\"deleted\"} is the bin). The driver's deletes are permanentDelete since WP-FLEET-2, so a large bin is from before it or from another app: the operator purge (fleet-admin/fleet-recyclebin.py, SharePoint RecycleBin/DeleteAll) is the owner's decision. Otherwise the drive is full of live shards: add accounts (WP-FLEET-7) or move a parity leg (VAULT_PARITY_LEGS). internal/drivers/onedrive_README.md § OneDrive Gotchas."

  # WP-FLEET-3: 15 throttles a minute on one account for 20 minutes fires
  # after 10; a one-minute burst (60 in a minute, then none) and 5 a minute
  # never do.
  - interval: 1m
    input_series:
      - series: 'vaultaire_permafrost_throttles_total{instance="slc",job="vaultaire",account="tenant-1",op="range"}'
        values: '0+15x30'
      - series: 'vaultaire_permafrost_throttles_total{instance="slc",job="vaultaire",account="tenant-2",op="range"}'
        values: '0x5 60x25'
      - series: 'vaultaire_permafrost_throttles_total{instance="slc",job="vaultaire",account="tenant-3",op="fragment"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PermafrostThrottling
        exp_alerts: []
      - eval_time: 20m
        alertname: PermafrostThrottling
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: slc
              job: vaultaire
              account: tenant-1
            exp_annotations:
              summary: "Permafrost account tenant-1 is being throttled (15 a minute)"
              description: "Microsoft has answered permafrost account tenant-1 with 429/503 more than 10 times a minute for 10 minutes (vaultaire_permafrost_throttles_total by op: graph, range, fragment, session). The driver waits each Retry-After out and holds the account meanwhile, so reads and writes there are slow, not wrong. Check vaultaire_permafrost_paced_seconds_total{dir=\"hold\"}, whether a PERMAFROST_ACCOUNT_* / PERMAFROST_TENANT_GBH knob was raised above the published rates (docs/FLEET.md), and whether another job shares the tenant. internal/drivers/onedrive_README.md § Throttle Handling."

  # WP-FLEET-10: one hash mismatch fires at once and clears an hour later.
  - interval: 1m
    input_series:
      - series: 'vaultaire_permafrost_hash_mismatch_total{instance="slc",job="vaultaire",account="tenant-2"}'
        values: '0x10 1x80'
    alert_rule_test:
      - eval_time: 9m
        alertname: PermafrostHashMismatch
        exp_alerts: []
      - eval_time: 15m
        alertname: PermafrostHashMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: slc
              job: vaultaire
              account: tenant-2
            exp_annotations:
              summary: "Permafrost account tenant-2: a write did not match what was sent"
              description: "In the last hour a write to permafrost account tenant-2 came back from Graph with another quickXorHash or size than the driver sent (vaultaire_permafrost_hash_mismatch_total). The item was deleted for good and the Put failed (engine.ErrObjectChanged): the parity job retries it. Once is a transfer fault; more than once on one account is the drive or its path — check the journal's 'quickXorHash' errors and the account's other writes. internal/drivers/onedrive_README.md § Upload Strategy."
      - eval_time: 85m
        alertname: PermafrostHashMismatch
        exp_alerts: []

  # WP-FLEET-10: walks for 20 minutes fire after 15; none never.
  - interval: 1m
    input_series:
      - series: 'vaultaire_permafrost_fallback_walks_total{instance="slc",job="vaultaire",op="get"}'
        values: '0+3x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: PermafrostFallbackWalking
        exp_alerts: []
      - eval_time: 25m
        alertname: PermafrostFallbackWalking
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: slc
              job: vaultaire
            exp_annotations:
              summary: "Permafrost reads are walking the fleet"
              description: "For 15 minutes permafrost Get/Exists/Delete calls have missed on their home account and walked up to 8 others (vaultaire_permafrost_fallback_walks_total): the fleet fingerprint is mismatch or unknown (vaultaire_permafrost_fleet_mismatch, the boot's and the probe's 'permafrost fleet fingerprint' lines). Restore the TENANT_N / fleet-file order, or rebalance and set PERMAFROST_FLEET_ACCEPT. internal/drivers/onedrive_README.md § The fleet file."
