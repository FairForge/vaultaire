# promtool unit test of vaultaire-backup.yml — BackupOffboxRetentionStuck (RP54-6,
# Stage 1a Prompt 39 Part 0), BackupOffboxRetentionNotRunning (RP55-1) and
# BackupDumpPlaintext (WP-P42). Run on the box (promtool is there):
#   scp deploy/monitoring/vaultaire-backup.yml deploy/monitoring/tests/vaultaire-backup_test.yml vaultaire-slc:/tmp/
#   ssh vaultaire-slc 'cd /tmp && promtool test rules vaultaire-backup_test.yml'
# The rule file path below is relative to this file's directory as copied.
rule_files:
  - vaultaire-backup.yml

evaluation_interval: 1m

tests:
  # Both legs report; only Blomp kept two old files: one alert, leg=blomp, after `for:`.
  # The timestamps are fresh so the stale rules stay quiet.
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_offbox_retention_undeleted_files{instance="localhost:9100",job="node"}'
        values: '0x30'
      - series: 'vaultaire_backup_offbox2_retention_undeleted_files{instance="localhost:9100",job="node"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: BackupOffboxRetentionStuck
        exp_alerts: []
      - eval_time: 15m
        alertname: BackupOffboxRetentionStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              leg: blomp
              instance: localhost:9100
              job: node
            exp_annotations:
              summary: "2 backup file(s) past their 30 days could not be deleted from the blomp off-box leg"
              description: "The last retention pass of pg-backup.sh listed old backups on blomp it could not delete. The privacy policy and the produce page say a deleted record stays in a backup up to 30 days: that holds only while this is 0. `grep -e 'could not delete' -e OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names them; the next run retries every one."

  # Both legs stuck at once: two alerts, never one label set (the `leg` label).
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_offbox_retention_undeleted_files{instance="localhost:9100",job="node"}'
        values: '1x30'
      - series: 'vaultaire_backup_offbox2_retention_undeleted_files{instance="localhost:9100",job="node"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: BackupOffboxRetentionStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              leg: sync
              instance: localhost:9100
              job: node
            exp_annotations:
              summary: "1 backup file(s) past their 30 days could not be deleted from the sync off-box leg"
              description: "The last retention pass of pg-backup.sh listed old backups on sync it could not delete. The privacy policy and the produce page say a deleted record stays in a backup up to 30 days: that holds only while this is 0. `grep -e 'could not delete' -e OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names them; the next run retries every one."
          - exp_labels:
              severity: warning
              leg: blomp
              instance: localhost:9100
              job: node
            exp_annotations:
              summary: "3 backup file(s) past their 30 days could not be deleted from the blomp off-box leg"
              description: "The last retention pass of pg-backup.sh listed old backups on blomp it could not delete. The privacy policy and the produce page say a deleted record stays in a backup up to 30 days: that holds only while this is 0. `grep -e 'could not delete' -e OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names them; the next run retries every one."

  # A clean pass (0 on both) or a box where the files do not exist yet: silent.
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_offbox_retention_undeleted_files{instance="localhost:9100",job="node"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupOffboxRetentionStuck
        exp_alerts: []

  # RP55-1 (Prompt 40): the Sync pass lists every run (its timestamp is its own sample time);
  # the Blomp pass last listed at t=100 s. Past 26 h + `for:` only the blomp leg fires.
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_offbox_retention_last_run_timestamp_seconds{instance="localhost:9100",job="node"}'
        values: '0+60x1700'
      - series: 'vaultaire_backup_offbox2_retention_last_run_timestamp_seconds{instance="localhost:9100",job="node"}'
        values: '100x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupOffboxRetentionNotRunning
        exp_alerts: []
      - eval_time: 26h15m
        alertname: BackupOffboxRetentionNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              leg: blomp
              instance: localhost:9100
              job: node
            exp_annotations:
              summary: "The blomp off-box leg's backup retention has not listed it in > 26 h"
              description: "pg-backup.sh's retention pass for blomp has not listed the leg for over 26 hours (or never has on this box), so nothing past its 30 days is being deleted there and BackupOffboxRetentionStuck reads an old count. The privacy policy and the produce page say a deleted record stays in a backup up to 30 days. `grep -e 'listing' -e OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names the failure."

  # A leg whose pass never listed it on this box (the counter lesson: a series born at its
  # first success never pages by itself) fires on absence, labelled with its leg.
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_offbox_retention_last_run_timestamp_seconds{instance="localhost:9100",job="node"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: BackupOffboxRetentionNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              leg: blomp
            exp_annotations:
              summary: "The blomp off-box leg's backup retention has not listed it in > 26 h"
              description: "pg-backup.sh's retention pass for blomp has not listed the leg for over 26 hours (or never has on this box), so nothing past its 30 days is being deleted there and BackupOffboxRetentionStuck reads an old count. The privacy policy and the produce page say a deleted record stays in a backup up to 30 days. `grep -e 'listing' -e OFFBOX2 /opt/vaultaire/logs/backup.log | tail` names the failure."

  # WP-P42: the dump written in plaintext (no recipients file) — pending for 26 h, then fires.
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_dump_encrypted{instance="localhost:9100",job="node"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupDumpPlaintext
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupDumpPlaintext
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: localhost:9100
              job: node
            exp_annotations:
              summary: "The nightly database dump is written to disk in plaintext"
              description: "pg-backup.sh has not sealed the dump with age for over 26 hours (or never reported it): /opt/vaultaire/configs/backup-age-recipients.txt is absent, or the installed script predates WP-P42. Every dump on the box for 7 days is then a readable copy of the database. Put the owner's offline age public keys in that file (root 0644, public lines only — docs/DEPLOY.md § Backups); `grep 'stage=encrypt' /opt/vaultaire/logs/backup.log | tail` says what the last run saw."

  # Sealed with age: never fires. And a box that switched to sealed after 20 h of plaintext
  # resets the `for:` — no alert at 27 h. (1 m samples: an hourly series goes stale between them.)
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_dump_encrypted{instance="localhost:9100",job="a"}'
        values: '1x1700'
      - series: 'vaultaire_backup_dump_encrypted{instance="localhost:9100",job="b"}'
        values: '0x1200 1x500'
    alert_rule_test:
      - eval_time: 27h
        alertname: BackupDumpPlaintext
        exp_alerts: []

  # Never reported (a script that predates the gauge, or no textfile symlink): absent fires
  # after 26 h with no labels of its own.
  - interval: 1m
    input_series:
      - series: 'vaultaire_backup_last_success_timestamp_seconds{instance="localhost:9100",job="node"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupDumpPlaintext
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupDumpPlaintext
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The nightly database dump is written to disk in plaintext"
              description: "pg-backup.sh has not sealed the dump with age for over 26 hours (or never reported it): /opt/vaultaire/configs/backup-age-recipients.txt is absent, or the installed script predates WP-P42. Every dump on the box for 7 days is then a readable copy of the database. Put the owner's offline age public keys in that file (root 0644, public lines only — docs/DEPLOY.md § Backups); `grep 'stage=encrypt' /opt/vaultaire/logs/backup.log | tail` says what the last run saw."
