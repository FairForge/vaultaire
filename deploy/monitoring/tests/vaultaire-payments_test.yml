# promtool unit test of vaultaire-payments.yml (WP-PAY-3, Stage 1a Prompt 20).
# Run on the box (promtool is there):
#   scp deploy/monitoring/vaultaire-payments.yml deploy/monitoring/tests/vaultaire-payments_test.yml vaultaire-slc:/tmp/
#   ssh vaultaire-slc 'cd /tmp && promtool test rules vaultaire-payments_test.yml'
# The rule file path below is relative to this file's directory as copied.
rule_files:
  - vaultaire-payments.yml

evaluation_interval: 1m

tests:
  # Prod today: ready 0, flag off → silent. Flag on + ready 0 for 15 m → critical.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payment_provider_ready{provider="stripe"}'
        values: '0x60'
      - series: 'vaultaire_payment_provider_enabled{provider="stripe"}'
        values: '0x20 1x40'
    alert_rule_test:
      - eval_time: 19m
        alertname: PaymentProviderDown
        exp_alerts: []
      - eval_time: 36m
        alertname: PaymentProviderDown
        exp_alerts:
          - exp_labels:
              severity: critical
              provider: stripe
            exp_annotations:
              summary: "Payment provider stripe is not ready while its flag is on"
              description: "vaultaire_payment_provider_ready{provider=\"stripe\"} has been 0 for 15 minutes with pay_stripe on: no checkout can start and the entitlement_lapse job skips its houses. Stripe: the key is missing or revoked, or a price no longer matches prices.json — journalctl -u 'vaultaire@*' | grep 'house prices' names the price; fix it in the Stripe dashboard, never in code."

  # A ready provider never fires, flag or no flag.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payment_provider_ready{provider="stripe"}'
        values: '1x60'
      - series: 'vaultaire_payment_provider_enabled{provider="stripe"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: PaymentProviderDown
        exp_alerts: []

  # One invalid house in the hour warns; a counter that stays flat does not.
  - interval: 1m
    input_series:
      - series: 'vaultaire_stripe_house_invalid_total'
        values: '0x30 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StripeHouseInvalid
        exp_alerts: []
      - eval_time: 45m
        alertname: StripeHouseInvalid
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Stripe subscription describes no valid house"
              description: "journalctl -u 'vaultaire@*' | grep 'no valid house' names the tenant, the subscription and the items; the audit row is billing.house_invalid. Fix the subscription's items in the Stripe dashboard — the next event re-grants the house."

  # Webhooks: 3 errors out of 4 deliveries in 15 min fire; 1 of 10 does not.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payment_webhook_total{provider="stripe",outcome="error"}'
        values: '0x5 3x20'
      - series: 'vaultaire_payment_webhook_total{provider="stripe",outcome="ok"}'
        values: '0x5 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentWebhookFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: stripe
            exp_annotations:
              summary: "stripe webhooks are failing (75% of deliveries in 15 min)"
              description: "Deliveries from stripe are answered 500 and retried by the provider; houses bought meanwhile are not applied until a delivery succeeds. journalctl -u 'vaultaire@*' | grep 'stripe webhook' gives the event id and the error (a claim lock timeout, a database error, a fetch of the subscription that failed)."

  # Skipped-unready on two runs running: the gauge held > 0 for 30 h.
  - interval: 1h
    input_series:
      - series: 'vaultaire_entitlement_lapse_skipped_unready'
        values: '0x24 2x24 2x24'
    alert_rule_test:
      - eval_time: 40h
        alertname: EntitlementLapseSkippedUnready
        exp_alerts: []
      - eval_time: 60h
        alertname: EntitlementLapseSkippedUnready
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "entitlement_lapse skipped 2 house(s) as provider_unready on two runs running"
              description: "A house past paid_through + grace is kept while its provider was unready in the last 24 h (by design — a house is never lost because our processor was down), but two days running means the provider is not coming back by itself. GET /api/v1/admin/jobs → entitlement_lapse.result.errors names the tenants and the provider; see PaymentProviderDown."

  # RP30-5: one settled_unpaid pages within the hour; a flat series does not.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payment_webhook_total{provider="btcpay",outcome="settled_unpaid"}'
        values: '0x30 1x30'
      - series: 'vaultaire_payment_webhook_total{provider="btcpay",outcome="mark_refused"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: BTCPayPaymentNotApplied
        exp_alerts: []
      - eval_time: 40m
        alertname: BTCPayPaymentNotApplied
        exp_alerts:
          - exp_labels:
              severity: critical
              outcome: settled_unpaid
            exp_annotations:
              summary: "A BTCPay delivery was acknowledged without being applied (settled_unpaid)"
              description: "journalctl -u 'vaultaire@*' -o cat | grep 'btcpay webhook' names the invoice and the tenant. settled_unpaid: BTCPay says Settled but paidAmount < amount — check the store's payment tolerance (must be 0 %) and whether an operator marked it; record a manual payment if the money is real. mark_refused: mark the late-paid invoice Settled by hand in BTCPay (the InvoiceSettled that follows grants it). fetch_refused: the store key is wrong or lost a permission (cancreateinvoice, canviewinvoices, canmodifyinvoices) — fix it, then redeliver the delivery from the BTCPay UI (it is handled fresh)."

  # A refused mark pages too.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payment_webhook_total{provider="btcpay",outcome="mark_refused"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: BTCPayPaymentNotApplied
        exp_alerts:
          - exp_labels:
              severity: critical
              outcome: mark_refused
            exp_annotations:
              summary: "A BTCPay delivery was acknowledged without being applied (mark_refused)"
              description: "journalctl -u 'vaultaire@*' -o cat | grep 'btcpay webhook' names the invoice and the tenant. settled_unpaid: BTCPay says Settled but paidAmount < amount — check the store's payment tolerance (must be 0 %) and whether an operator marked it; record a manual payment if the money is real. mark_refused: mark the late-paid invoice Settled by hand in BTCPay (the InvoiceSettled that follows grants it). fetch_refused: the store key is wrong or lost a permission (cancreateinvoice, canviewinvoices, canmodifyinvoices) — fix it, then redeliver the delivery from the BTCPay UI (it is handled fresh)."

  # RP37-6: an unconfirmable BTCPay invoice pages; at 0 it is silent.
  - interval: 1m
    input_series:
      - series: 'vaultaire_btcpay_unconfirmable_total'
        values: '0x30 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BTCPayPaymentUnconfirmable
        exp_alerts: []
      - eval_time: 40m
        alertname: BTCPayPaymentUnconfirmable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "A BTCPay invoice holds money that cannot be shown confirmed (no payments listed)"
              description: "journalctl -u 'vaultaire@*' -o cat | grep 'lists no payments' names the invoice and the tenant. Nothing was credited or granted. Open the invoice in BTCPay: if its payments are confirmed, record a manual payment or credit; check that the server runs BTCPay 2.x (the Greenfield payment-methods answer must list payments[])."

  # foreign warns; at 0 it is silent.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payment_webhook_total{provider="btcpay",outcome="foreign"}'
        values: '0x30 2x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BTCPayWebhookForeign
        exp_alerts: []
      - eval_time: 40m
        alertname: BTCPayWebhookForeign
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "BTCPay deliveries for invoices the ledger does not match (last hour)"
              description: "journalctl -u 'vaultaire@*' -o cat | grep 'btcpay webhook' gives the invoice and why (unknown here, unknown at BTCPay, metadata tenant, amount). The store must have ONE webhook, ever (delete the old URL before adding a new one). Nothing was applied; a redelivery after a fix is handled fresh."

  # RP30-7: a refund mismatch warns.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payments_total{provider="stripe",kind="refund",outcome="mismatch"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: StripeRefundMismatch
        exp_alerts: []
      - eval_time: 15m
        alertname: StripeRefundMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Stripe refund disagrees with the ledger's row under its id"
              description: "journalctl -u 'vaultaire@*' -o cat | grep 'refund disagrees' names the tenant, the re_ id and both amounts. Correct the ledger by hand (an adjustment) to what Stripe actually refunded."

  # WP-PAY-5: a double period warns, per provider.
  - interval: 1m
    input_series:
      - series: 'vaultaire_payments_double_period_total{provider="stripe"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: PaymentDoublePeriod
        exp_alerts: []
      - eval_time: 15m
        alertname: PaymentDoublePeriod
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: stripe
            exp_annotations:
              summary: "A customer paid twice for overlapping dates (stripe)"
              description: "The audit row billing.double_period names both ledger rows (GET /api/v1/admin/tenants/<tenant>/payments). Refund one of them with the provider, then record it with POST /api/v1/admin/tenants/<tenant>/refunds. journalctl -u 'vaultaire@*' -o cat | grep 'paid twice'."

  # WP-PAY-5: a stop pending for an hour warns; a shorter one does not.
  - interval: 5m
    input_series:
      - series: 'vaultaire_payment_renewal_stops_pending'
        values: '0x3 1x6 0x3 1x20'
    alert_rule_test:
      - eval_time: 40m
        alertname: RenewalStopsPending
        exp_alerts: []
      - eval_time: 150m
        alertname: RenewalStopsPending
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "1 subscription(s) a provider switch replaced are not confirmed stopped"
              description: "GET /api/v1/admin/jobs → renewal_stops.result.errors names each provider:subscription and why (Stripe not configured, an API error). Stop it by hand in the Stripe dashboard (cancel at period end) — the next run then reads it as stopped. While pending it may bill a period the customer already paid (PaymentDoublePeriod)."
