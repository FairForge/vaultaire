repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: go fmt ./...
        language: system
        types: [go]
        pass_filenames: false

      # The short suite takes several minutes with the DB-backed packages, so
      # it runs on push, not on every commit (Review R15). Install both hooks:
      #   pre-commit install && pre-commit install --hook-type pre-push
      - id: go-test
        name: go test (pre-push)
        entry: go test ./... -short
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
