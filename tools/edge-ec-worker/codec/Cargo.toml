[package]
name = "eccodec"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
reed-solomon-erasure = { version = "6", default-features = false }
raptorq = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
