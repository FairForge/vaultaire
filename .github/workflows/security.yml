name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# upload-sarif needs security-events:write; without an explicit block the
# push-event token is read-only and the trivy job fails on every main push.
permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        # Known false positives for a storage system:
        #   G101: env var names flagged as hardcoded creds
        #   G115: safe bounded integer conversions
        #   G301: MkdirAll 0755 is correct for storage directories
        #   G304: file path handling is core to a storage system
        # cmd/tools holds operator-run probes and benches whose "tainted"
        # inputs are the operator's own flags and env (Review R15); the
        # product binary is cmd/vaultaire only (`go list -deps` proves it).
        # `make gosec` runs the identical command locally.
        run: >-
          gosec -severity medium
          -exclude-dir=tests
          -exclude-dir=cmd/tools
          -exclude=G101,G115,G301,G304
          ./...

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # govulncheck reports only vulnerabilities whose functions the binary
      # actually reaches (Review R15). It was advisory until the toolchain
      # moved to Go 1.26 (D-24, 2026-10-10), which the fixed x/ modules
      # require; with x/crypto 0.58 it reports 0 reachable, so it now fails
      # the job.
      - name: Check for reachable vulnerabilities (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
