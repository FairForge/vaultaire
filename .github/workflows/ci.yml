name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # The merge queue (main ruleset, 2026-10-06): a queued PR is tested on a
  # temporary merge branch and merged only when build-and-test is green
  # there. This is what lets the ruleset keep strict_required_status_checks
  # WITHOUT every merge forcing every open PR to rebase and rerun — the
  # cause of the PR-stack churn of 2026-10-05. Never add a paths filter to
  # this event or to pull_request: the required check must always report.
  merge_group:
  # Manual lever for dropped/delayed push triggers (see deploy.yml note).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The official image from the ECR Public mirror: Docker Hub refuses
        # anonymous pulls from the shared runner IPs (toomanyrequests,
        # 2026-10-09: every build-and-test failed in Initialize containers).
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultaire
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Raise the Postgres connection limit
        # `go test -race ./...` runs every package in parallel on this one
        # server; 11 packages open their own pools (66 sql.Open sites in the
        # tests) and the image's default max_connections=100 has failed main
        # three times with "pq: sorry, too many clients already" (53300) on
        # merges that touched nothing near the failing package. A service
        # container takes no command, so the limit is raised with ALTER
        # SYSTEM (persisted in postgresql.auto.conf) and a container restart.
        run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 400;"
          cid=$(docker ps -q --filter "ancestor=postgres:15" | head -1)
          docker restart "$cid"
          for i in $(seq 1 30); do pg_isready -h localhost -U postgres && break; sleep 1; done
          psql -h localhost -U postgres -tAc "SHOW max_connections;"

      - name: Set up database
        run: |
          psql -h localhost -U postgres -c "CREATE USER viera SUPERUSER;" || true
          psql -h localhost -U postgres -c "CREATE DATABASE vaultaire OWNER viera;" || true
          # ON_ERROR_STOP: without it psql exits 0 even when statements fail,
          # so a broken migration sails through CI and only detonates on the
          # (equally strict since WP-9) prod deploy runner.
          for f in internal/database/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U viera -d vaultaire -f "$f"
          done

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
        env:
          DATABASE_URL: postgres://viera@localhost:5432/vaultaire?sslmode=disable
          JWT_SECRET: ci-test-secret-not-for-production
          TEST_DB_HOST: localhost
          TEST_DB_NAME: vaultaire
          TEST_DB_USER: viera
          TEST_DB_PASSWORD: ""

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0

      - name: Deploy scripts
        run: |
          bash deploy/scripts/pg-backup_test.sh
          bash deploy/scripts/vaultaire-switch_test.sh

      - name: Smoke test
        run: |
          go build -ldflags "-X github.com/FairForge/vaultaire/internal/api.BuildSHA=${GITHUB_SHA::12} -X github.com/FairForge/vaultaire/internal/api.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o vaultaire ./cmd/vaultaire
          ./vaultaire &
          sleep 5
          # Liveness smoke: assert the server booted and serves HTTP — NOT that
          # backends are ready. /health is a READINESS probe that returns 503
          # when an external backend (e.g. the decommissioned quotaless endpoint)
          # is unreachable; that says nothing about whether the build is good and
          # can't be retried away when the host is persistently down. /health/live
          # and /status always return 200 once the process is up.
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/health/live
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/status > /dev/null
        env:
          DATABASE_URL: postgres://viera@localhost:5432/vaultaire?sslmode=disable
          JWT_SECRET: ci-test-secret-not-for-production
          PORT: "8000"

  # The landing page's house builder, driven in headless Chrome
  # (internal/api/landing/browser/harness.html). Needs no database.
  landing-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: Set up Node (pointer.mjs drives Chrome over the DevTools protocol)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Browser checks
        run: bash internal/api/landing/browser/run.sh
        env:
          CHROME: google-chrome
