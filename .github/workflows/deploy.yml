name: Deploy

on:
  push:
    branches:
      - develop
      - main
    # A docs-only merge used to redeploy prod (16 of the 60 deploys of the
    # week to 2026-10-06), and every deploy stops the service — in-flight
    # uploads of other sessions' live tests died with it. The paths below
    # never reach the binary. NOT ignored: internal/api/*.md and
    # internal/dashboard/{templates,static} — they are go:embed'ed, a change
    # there IS a product change. A push that mixes an ignored path with any
    # other file still deploys.
    paths-ignore:
      - "docs/**"
      - ".private/**"
      - "bench-results/**"
      - "deploy/**"
      - "cmd/tools/**"
      - "tests/**"
      - ".claude/**"
      - ".github/dependabot.yml"
      - ".github/*.md"
      - ".github/CODEOWNERS"
      - ".pre-commit-config.yaml"
      - ".golangci.yml"
      - "README.md"
      - "LICENSE"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - "**/*_README.md"
  # Manual lever: GitHub occasionally drops/delays push triggers (observed
  # 2026-07-19, ~25 min with zero runs for the merge SHA). This also gives a
  # clean re-deploy button for DR drills: gh workflow run deploy.yml --ref main
  workflow_dispatch:

# Queue deploys per branch, never cancel one mid-flight: two quick merges to
# main must not interleave their SSH stop/swap/start sequences on the box.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build
        # Stamp the commit + time into /version, /health and /status (WP-R14-4).
        run: GOOS=linux GOARCH=amd64 go build -ldflags "-X github.com/FairForge/vaultaire/internal/api.BuildSHA=${GITHUB_SHA::12} -X github.com/FairForge/vaultaire/internal/api.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o vaultaire-linux ./cmd/vaultaire

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: vaultaire-linux
          path: vaultaire-linux

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for migrations + the DB_PASSWORD parser)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            internal/database/migrations
            deploy/scripts

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: vaultaire-linux

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Dev
        env:
          HOST: ${{ secrets.DEV_HOST }}
          USER: ${{ secrets.SSH_USER_DEV }}
        run: |
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts
          # Keepalives: vaultaire-switch waits silently for the old slot to
          # drain (up to 600 s of sessions, 900 s of long operations); an idle
          # session was cut after ~4 min (2026-10-09, 9af3ab4: "client_loop:
          # send disconnect: Broken pipe" — the switch finished on the box,
          # the job failed and skipped the /version check).
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 40\n' >> ~/.ssh/config
          # Clear stale staging artifacts before uploading. A prior failed deploy or a
          # stray instance can leave /tmp/vaultaire-linux behind; unlinking frees the
          # path even when the file is still held by a running process, which otherwise
          # makes scp fail with "dest open ... Failure" (ETXTBSY).
          ssh "${USER}@${HOST}" 'rm -f /tmp/vaultaire-linux /tmp/vaultaire-db-password.sh; rm -rf /tmp/vaultaire-migrations'
          scp vaultaire-linux "${USER}@${HOST}:/tmp/"
          scp -r internal/database/migrations "${USER}@${HOST}:/tmp/vaultaire-migrations"
          scp deploy/scripts/db-password.sh "${USER}@${HOST}:/tmp/vaultaire-db-password.sh"
          ssh "${USER}@${HOST}" 'bash -s' <<'EOF'
          set -e
          # The password exactly as pg-backup.sh reads it (deploy/scripts/db-password.sh:
          # everything after the first `=`, one quote level removed, DB_PASSWORD_OLD never
          # matched). The old grep-and-cut one-liner broke on any rotated password with
          # an `=` in it. A missing line fails the deploy here, before any migration.
          . /tmp/vaultaire-db-password.sh
          DB_PW=$(db_password_from_env /opt/vaultaire/configs/.env)
          rm -f /tmp/vaultaire-db-password.sh
          for f in $(ls /tmp/vaultaire-migrations/*.sql | sort); do
            # -w + </dev/null: if the DB password is unavailable, psql must FAIL,
            # not prompt — a prompt reads the rest of this script off stdin as
            # password attempts, silently skipping the binary swap below while
            # the job still exits 0 (observed 2026-06-08..07-09 on prod).
            PGPASSWORD="$DB_PW" \
              psql -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vaultaire -d vaultaire -f "$f" < /dev/null
          done
          # Keep the previous binary for one-command rollback.
          cp -f /opt/vaultaire/bin/vaultaire /opt/vaultaire/bin/vaultaire.prev 2>/dev/null || true
          sudo /bin/systemctl stop vaultaire
          sudo /bin/mv /tmp/vaultaire-linux /opt/vaultaire/bin/vaultaire
          sudo /bin/chmod +x /opt/vaultaire/bin/vaultaire
          sudo /bin/systemctl start vaultaire
          sleep 15
          # Gate on LIVENESS (/health/live), not readiness (/health): /health
          # returns 503 when an external backend is unreachable, which a
          # rollback cannot fix — the old binary would 503 too. /health/live
          # answers the only question a binary swap can affect: does the new
          # process boot and serve HTTP.
          if ! curl -sf --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/health/live; then
            echo "Health check FAILED — rolling back to previous binary"
            # Rollback reuses exactly the NOPASSWD'd commands (systemctl,
            # mv /tmp/vaultaire-linux, chmod): stage .prev via /tmp because
            # 'sudo cp' is not in the sudoers allowlist.
            sudo /bin/systemctl stop vaultaire
            cp -f /opt/vaultaire/bin/vaultaire.prev /tmp/vaultaire-linux
            sudo /bin/mv /tmp/vaultaire-linux /opt/vaultaire/bin/vaultaire
            sudo /bin/chmod +x /opt/vaultaire/bin/vaultaire
            sudo /bin/systemctl start vaultaire
            sleep 5
            curl -sf http://localhost:8000/health/live \
              && echo "Rollback binary is serving" \
              || echo "Rollback ALSO unhealthy — manual intervention required"
            exit 1
          fi
          rm -rf /tmp/vaultaire-migrations
          EOF

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets resolve from the environment first: prod SSH key/host/user live as
    # environment secrets deployable only from main, not as repo-level secrets.
    environment: production
    steps:
      - name: Checkout (for migrations + the DB_PASSWORD parser)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            internal/database/migrations
            deploy/scripts

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: vaultaire-linux

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Production (SLC)
        env:
          HOST: ${{ secrets.PROD_SLC_HOST }}
          USER: ${{ secrets.SSH_USER_PROD }}
        run: |
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts
          # Keepalives: vaultaire-switch waits silently for the old slot to
          # drain (up to 600 s of sessions, 900 s of long operations); an idle
          # session was cut after ~4 min (2026-10-09, 9af3ab4: "client_loop:
          # send disconnect: Broken pipe" — the switch finished on the box,
          # the job failed and skipped the /version check).
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 40\n' >> ~/.ssh/config
          # Clear stale staging artifacts before uploading. A prior failed deploy or a
          # stray instance can leave /tmp/vaultaire-linux behind; unlinking frees the
          # path even when the file is still held by a running process, which otherwise
          # makes scp fail with "dest open ... Failure" (ETXTBSY).
          ssh "${USER}@${HOST}" 'rm -f /tmp/vaultaire-linux /tmp/vaultaire-db-password.sh; rm -rf /tmp/vaultaire-migrations'
          scp vaultaire-linux "${USER}@${HOST}:/tmp/"
          scp -r internal/database/migrations "${USER}@${HOST}:/tmp/vaultaire-migrations"
          scp deploy/scripts/db-password.sh "${USER}@${HOST}:/tmp/vaultaire-db-password.sh"
          ssh "${USER}@${HOST}" 'bash -s' <<'EOF'
          set -e
          # The password exactly as pg-backup.sh reads it (deploy/scripts/db-password.sh:
          # everything after the first `=`, one quote level removed, DB_PASSWORD_OLD never
          # matched). The old grep-and-cut one-liner broke on any rotated password with
          # an `=` in it. A missing line fails the deploy here, before any migration.
          . /tmp/vaultaire-db-password.sh
          DB_PW=$(db_password_from_env /opt/vaultaire/configs/.env)
          rm -f /tmp/vaultaire-db-password.sh
          for f in $(ls /tmp/vaultaire-migrations/*.sql | sort); do
            # -w + </dev/null: if the DB password is unavailable, psql must FAIL,
            # not prompt — a prompt reads the rest of this script off stdin as
            # password attempts, silently skipping the binary swap below while
            # the job still exits 0 (observed 2026-06-08..07-09 on prod).
            # lock_timeout: the old build is still serving while migrations run
            # (zero-downtime deploys), so a DDL that has to wait for a lock gives up
            # after 5 s and fails the deploy instead of queueing every query on that
            # table behind it. Migrations must stay additive: the build before this
            # one keeps running against the migrated schema until the switch.
            PGOPTIONS='-c lock_timeout=5s' PGPASSWORD="$DB_PW" \
              psql -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vaultaire -d vaultaire -f "$f" < /dev/null
          done
          rm -rf /tmp/vaultaire-migrations
          # Zero-downtime swap (2026-10-06, docs/DEPLOY.md "Zero-downtime deploys"):
          # the new binary goes into the IDLE slot (vaultaire@8000 / vaultaire@8001),
          # is started, must answer /health/live, then HAProxy is switched to it and
          # the old slot drained and stopped. If the new binary never becomes live
          # the script exits 1 with its journal and the active slot is untouched —
          # there is nothing to roll back. `sudo vaultaire-switch rollback` is the
          # manual lever back to the previous build (it still sits in the other slot).
          # The invocation is pinned in sudoers: exactly this path, nothing else.
          sudo /usr/local/sbin/vaultaire-switch deploy /tmp/vaultaire-linux
          EOF

      - name: Verify the public endpoint serves this build
        run: |
          want="${GITHUB_SHA::12}"
          for _ in $(seq 1 12); do
            got=$(curl -sf --max-time 10 https://stored.ge/version | sed -n 's/.*"version":"\([0-9a-f]*\)".*/\1/p')
            [ "$got" = "$want" ] && { echo "stored.ge serves $got"; exit 0; }
            sleep 5
          done
          echo "::error::stored.ge/version reports '${got:-nothing}', expected $want"
          exit 1
