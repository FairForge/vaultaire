name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-X github.com/FairForge/vaultaire/internal/api.BuildSHA=${GITHUB_SHA::12} -X github.com/FairForge/vaultaire/internal/api.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o vaultaire-linux-amd64 ./cmd/vaultaire
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/FairForge/vaultaire/internal/api.BuildSHA=${GITHUB_SHA::12} -X github.com/FairForge/vaultaire/internal/api.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o vaultaire-darwin-amd64 ./cmd/vaultaire
          GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/FairForge/vaultaire/internal/api.BuildSHA=${GITHUB_SHA::12} -X github.com/FairForge/vaultaire/internal/api.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o vaultaire-windows-amd64.exe ./cmd/vaultaire

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            vaultaire-linux-amd64
            vaultaire-darwin-amd64
            vaultaire-windows-amd64.exe
          generate_release_notes: true
